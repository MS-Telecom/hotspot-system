<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe do Cliente - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">

  <script>
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
  </script>

  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="settings" class="w-5 h-5"></i>Configurações</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <a href="cadastro.html" class="text-gray-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
        <h1 class="text-2xl font-bold">Detalhe do Cliente</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <!-- Dados do cliente -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="font-semibold mb-4 text-lg">Informações Pessoais</h3>
        <div class="space-y-3" id="clientInfo">
          <p class="text-gray-400">Carregando...</p>
        </div>
      </div>
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="font-semibold mb-4 text-lg">Plano e Acesso</h3>
        <div class="space-y-3" id="clientPlan">
          <p class="text-gray-400">Carregando...</p>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="toggleStatus()" id="btnToggleStatus" class="flex-1 bg-green-600 hover:bg-green-700 py-2 rounded-lg font-medium text-sm">Ativar</button>
          <button onclick="toggleVip()" id="btnToggleVip" class="flex-1 bg-purple-600 hover:bg-purple-700 py-2 rounded-lg font-medium text-sm">Tornar VIP</button>
        </div>
      </div>
    </div>

    <!-- Editar -->
    <div class="bg-gray-800 rounded-xl p-6">
      <h3 class="font-semibold mb-4 text-lg">Editar Cliente</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm text-gray-400 mb-1">Nome</label><input id="editName" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">CPF</label><input id="editCpf" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Telefone</label><input id="editPhone" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="editEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">MAC Address</label><input id="editMac" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Endereço</label><input id="editAddress" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Plano</label><select id="editPlan" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none"><option value="">Selecione...</option></select></div>
      </div>
      <button onclick="saveClient()" class="mt-6 bg-cyan-500 hover:bg-cyan-600 px-6 py-2 rounded-lg font-medium">Salvar Alterações</button>
    </div>
  </main>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    lucide.createIcons();

    function initMenuMobile() {
        const btnMenu = document.getElementById('btnMenuMobile');
        const sidebar = document.getElementById('sidebar');
        if (btnMenu && sidebar) {
            btnMenu.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');
    let currentClient = null;

    async function loadClient() {
      if (!clientId) { alert('ID do cliente não informado'); window.location.href = 'cadastro.html'; return; }
      try {
        const res = await fetch(`${API_URL}/api/users`, { headers });
        const usersPayload = await res.json();
        const users = usersPayload.data || [];
        currentClient = users.find(u => String(u.id) === String(clientId));
        if (!currentClient) { alert('Cliente não encontrado'); window.location.href = 'cadastro.html'; return; }

        // Info pessoal
        document.getElementById('clientInfo').innerHTML = `
          <div class="flex justify-between"><span class="text-gray-400">Nome:</span><span>${currentClient.name || '-'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">CPF:</span><span>${currentClient.cpf || '-'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">Telefone:</span><span>${currentClient.phone || '-'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">E-mail:</span><span>${currentClient.email || '-'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">MAC:</span><span class="text-xs">${currentClient.mac_address || '-'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">Endereço:</span><span>${currentClient.address || '-'}</span></div>
        `;

        const statusColor = currentClient.status === 'active' ? 'text-green-400' : 'text-red-400';
        const expiresDate = currentClient.expires_at ? new Date(currentClient.expires_at).toLocaleDateString('pt-BR') : '-';
        document.getElementById('clientPlan').innerHTML = `
          <div class="flex justify-between"><span class="text-gray-400">Plano:</span><span>${currentClient.plan_name || 'Nenhum'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">Status:</span><span class="${statusColor}">${currentClient.status || 'inactive'}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">Expira em:</span><span>${expiresDate}</span></div>
          <div class="flex justify-between"><span class="text-gray-400">VIP:</span><span>${currentClient.is_vip ? 'Sim' : 'Não'}</span></div>
        `;

        document.getElementById('btnToggleStatus').textContent = currentClient.status === 'active' ? 'Desativar' : 'Ativar';
        document.getElementById('btnToggleStatus').className = currentClient.status === 'active' ? 'flex-1 bg-red-600 hover:bg-red-700 py-2 rounded-lg font-medium text-sm' : 'flex-1 bg-green-600 hover:bg-green-700 py-2 rounded-lg font-medium text-sm';
        document.getElementById('btnToggleVip').textContent = currentClient.is_vip ? 'Remover VIP' : 'Tornar VIP';

        // Preencher formulário de edição
        document.getElementById('editName').value = currentClient.name || '';
        document.getElementById('editCpf').value = currentClient.cpf || '';
        document.getElementById('editPhone').value = currentClient.phone || '';
        document.getElementById('editEmail').value = currentClient.email || '';
        document.getElementById('editMac').value = currentClient.mac_address || '';
        document.getElementById('editAddress').value = currentClient.address || '';
      } catch (err) { console.error('Erro:', err); }
    }

    async function loadPlans() {
      try {
        const res = await fetch(`${API_URL}/api/plans`, { headers });
        const plans = await res.json();
        const select = document.getElementById('editPlan');
        (plans.data || []).forEach(p => {
          const selected = currentClient && String(currentClient.plan_id) === String(p.id) ? 'selected' : '';
          select.innerHTML += `<option value="${p.id}" data-name="${p.name}" ${selected}>${p.name} - R$ ${parseFloat(p.price).toFixed(2).replace('.',',')}</option>`;
        });
      } catch (err) { console.error('Erro:', err); }
    }

    async function saveClient() {
      try {
        const planSelect = document.getElementById('editPlan');
        const body = {
          name: document.getElementById('editName').value,
          cpf: document.getElementById('editCpf').value,
          phone: document.getElementById('editPhone').value,
          email: document.getElementById('editEmail').value,
          mac_address: document.getElementById('editMac').value,
          address: document.getElementById('editAddress').value,
          plan_id: planSelect.value || null,
          plan_name: planSelect.options[planSelect.selectedIndex]?.dataset?.name || ''
        };
        const res = await fetch(`${API_URL}/api/users/${clientId}`, { method: 'PUT', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro ao salvar');
        alert('Cliente atualizado!'); loadClient();
      } catch (err) { alert(err.message); }
    }

    async function toggleStatus() {
      const newStatus = currentClient.status === 'active' ? 'inactive' : 'active';
      try {
        await fetch(`${API_URL}/api/users/${clientId}/status`, { method: 'PUT', headers, body: JSON.stringify({ status: newStatus }) });
        loadClient();
      } catch (err) { alert('Erro ao alterar status'); }
    }

    async function toggleVip() {
      const newVip = !currentClient.is_vip;
      try {
        await fetch(`${API_URL}/api/users/${clientId}/vip`, { method: 'PUT', headers, body: JSON.stringify({ is_vip: newVip }) });
        loadClient();
      } catch (err) { alert('Erro ao alterar status VIP'); }
    }

    function carregarPerfil() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                document.getElementById('profileUsername').value = user.username || '';
                document.getElementById('profileEmail').value = user.email || '';
            } catch(e) { console.error("Erro ao carregar perfil", e); }
        }
    }

    function openModalPerfil() {
        carregarPerfil();
        document.getElementById('modalPerfil').classList.remove('hidden');
    }

    function closeModalPerfil() {
        document.getElementById('modalPerfil').classList.add('hidden');
    }

    async function salvarPerfil() {
        const email = document.getElementById('profileEmail').value;
        const password = document.getElementById('profilePassword').value;
        const body = { email };
        if (password) {
            body.password = password;
        }

        try {
            const res = await fetch(`${API_URL}/api/update-profile`, { method: 'PUT', headers, body: JSON.stringify(body) });
            if (!res.ok) throw new Error('Erro ao salvar perfil');
            alert('Perfil atualizado!');
            closeModalPerfil();
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.email = email;
            localStorage.setItem('user', JSON.stringify(user));
        } catch (err) {
            alert(err.message);
        }
    }

    async function sair() {
        try {
            await fetch(`${API_URL}/api/logout`, { method: 'POST', headers });
        } catch (e) {}
        localStorage.removeItem('token');
        localStorage.removeItem('ms_token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        initMenuMobile();
        loadClient();
        loadPlans();
    });
  </script>
</body>
</html>
