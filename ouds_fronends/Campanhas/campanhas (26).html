<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanhas - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">
  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="settings" class="w-5 h-5"></i>Configurações</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3"><button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button><h1 class="text-2xl font-bold">Campanhas</h1></div><div class="relative w-full md:w-96"><i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4"></i><input type="text" id="searchInput" placeholder="Buscar campanha por nome, cupom..." class="w-full bg-gray-900/50 border border-gray-700 rounded-xl pl-11 pr-4 py-2.5 text-sm outline-none focus:border-blue-500 transition"></div>
      <div class="flex items-center gap-3">
        <button onclick="openModal()" class="flex items-center gap-2 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i>Nova Campanha</button>
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <div class="bg-gray-800 rounded-xl p-4">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">Nome</th><th class="text-left py-3">Cupom</th><th class="text-left py-3">Status</th><th class="text-left py-3">Início</th><th class="text-left py-3">Fim</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Criar/Editar -->
  <div id="modalCampaign" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 id="modalTitle" class="text-lg font-bold">Nova Campanha</h3><button onclick="closeModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <input type="hidden" id="editId">
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Nome</label><input id="inputName" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Descrição</label><textarea id="inputDescription" rows="2" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></textarea></div>
        <div><label class="block text-sm text-gray-400 mb-1">Código do Cupom</label><input id="inputCoupon" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm text-gray-400 mb-1">Início</label><input id="inputStartsAt" type="date" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none"></div>
          <div><label class="block text-sm text-gray-400 mb-1">Fim</label><input id="inputEndsAt" type="date" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none"></div>
        </div>
        <div><label class="block text-sm text-gray-400 mb-1">Status</label><select id="inputStatus" class="w-full px-3 py-2 bg-gray-700 rounded-lg"><option value="ativa">Ativa</option><option value="inativa">Inativa</option></select></div><div><label class="block text-sm text-gray-400 mb-1">Gênero</label><select id="campaignGenero" class="w-full px-3 py-2 bg-gray-700 rounded-lg"><option value="todos">Todos</option><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="outro">Outro</option></select></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm text-gray-400 mb-1">Idade Mínima</label><input id="campaignIdadeMin" type="number" placeholder="18" min="0" max="120" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div><div><label class="block text-sm text-gray-400 mb-1">Idade Máxima</label><input id="campaignIdadeMax" type="number" placeholder="65" min="0" max="120" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div></div>
      </div>
      <button onclick="saveCampaign()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button>
    </div>
  </div>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    let campaignsData = [];
    let currentCampaignId = null;
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    lucide.createIcons(); initMenuMobile();

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredCampaigns = campaignsData.filter(c => 
            c.name.toLowerCase().includes(searchTerm) || 
            (c.coupon_code && c.coupon_code.toLowerCase().includes(searchTerm))
        );
        renderCampaigns(filteredCampaigns);
    });

    async function loadCampaigns() {
      try {
        const res = await fetch(`${API_URL}/api/campaigns`, { headers });
        const data = await res.json();
        campaignsData = data;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        renderCampaigns(data);
        function renderCampaigns(campaigns) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (!campaigns || campaigns.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-500">Nenhuma campanha encontrada</td></tr>'; return; }
        campaigns.forEach(c => {
          const statusColor = c.status === 'active' ? 'text-green-400' : 'text-gray-400';
          const start = c.starts_at ? new Date(c.starts_at).toLocaleDateString('pt-BR') : '-';
          const end = c.ends_at ? new Date(c.ends_at).toLocaleDateString('pt-BR') : '-';
          tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="py-3">${c.name}</td><td class="py-3">${c.coupon_code || '-'}</td><td class="py-3 ${statusColor}">${c.status}</td><td class="py-3">${start}</td><td class="py-3">${end}</td>
            <td class="py-3 flex gap-1"><button onclick='editCampaign(${JSON.stringify(c)})' class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">Editar</button><button onclick="deleteCampaign(${c.id})" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button></td></tr>`;
                });
    }
      } catch (err) { console.error('Erro:', err); }
    }

    function openModal() { document.getElementById('editId').value = ''; document.getElementById('modalTitle').textContent = 'Nova Campanha'; document.getElementById('inputName').value = ''; document.getElementById('inputDescription').value = ''; document.getElementById('inputCoupon').value = ''; document.getElementById('inputStartsAt').value = ''; document.getElementById('inputEndsAt').value = ''; document.getElementById('inputStatus').value = 'active'; document.getElementById('modalCampaign').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modalCampaign').classList.add('hidden'); }

    function editCampaign(c) {
      document.getElementById('editId').value = c.id;
      document.getElementById('modalTitle').textContent = 'Editar Campanha';
      document.getElementById('inputName').value = c.name || '';
      document.getElementById('inputDescription').value = c.description || '';
      document.getElementById('inputCoupon').value = c.coupon_code || '';
      document.getElementById('inputStartsAt').value = c.starts_at ? c.starts_at.split('T')[0] : '';
      document.getElementById('inputEndsAt').value = c.ends_at ? c.ends_at.split('T')[0] : '';
      document.getElementById('inputStatus').value = c.status || 'active';
      document.getElementById('modalCampaign').classList.remove('hidden');
    }

    async function saveCampaign() {
      try {
        const id = document.getElementById('editId').value;
        const body = { name: document.getElementById('inputName').value, description: document.getElementById('inputDescription').value, coupon_code: document.getElementById('inputCoupon').value, starts_at: document.getElementById('inputStartsAt').value || null, ends_at: document.getElementById('inputEndsAt').value || null, status: document.getElementById('inputStatus').value, gender: document.getElementById('campaignGenero').value, min_age: document.getElementById('campaignIdadeMin').value, max_age: document.getElementById('campaignIdadeMax').value };
        const url = id ? `${API_URL}/api/campaigns/${id}` : `${API_URL}/api/campaigns`;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro ao salvar');
        closeModal(); loadCampaigns();
      } catch (err) { alert(err.message); }
    }

    async function deleteCampaign(id) {
      if (!confirm('Excluir esta campanha?')) return;
      try { await fetch(`${API_URL}/api/campaigns/${id}`, { method: 'DELETE', headers }); loadCampaigns(); } catch (err) { alert('Erro'); }
    }

    function carregarPerfil() { const user = JSON.parse(localStorage.getItem('user') || '{}'); document.getElementById('profileUsername').value = user.username || ''; document.getElementById('profileEmail').value = user.email || ''; }
    function openModalPerfil() { carregarPerfil(); document.getElementById('modalPerfil').classList.remove('hidden'); }
    function closeModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
    async function salvarPerfil() { try { const body = {}; const e = document.getElementById('profileEmail').value; const p = document.getElementById('profilePassword').value; if(e) body.email=e; if(p) body.password=p; const res = await fetch(`${API_URL}/api/update-profile`,{method:'PUT',headers,body:JSON.stringify(body)}); if(!res.ok) throw new Error('Erro'); alert('Perfil atualizado!'); closeModalPerfil(); } catch(err){ alert(err.message); } }
    function sair() { fetch(`${API_URL}/api/logout`,{method:'POST',headers}).catch(()=>{}); localStorage.removeItem('token'); localStorage.removeItem('ms_token'); localStorage.removeItem('user'); window.location.href='login.html'; }
    function initMenuMobile() { const btn=document.getElementById('btnMenuMobile'); const sb=document.getElementById('sidebar'); if(btn) btn.addEventListener('click',()=>sb.classList.toggle('open')); }

    loadCampaigns();
  </script>
</body>
</html>
