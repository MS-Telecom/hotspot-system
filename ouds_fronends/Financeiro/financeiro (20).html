<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">
  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="settings" class="w-5 h-5"></i>Configurações</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <h1 class="text-2xl font-bold">Financeiro</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openModalPayment()" class="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i>Novo Pagamento</button>
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <!-- Cards resumo -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-gray-800 rounded-xl p-4"><div class="flex items-center justify-between mb-2"><span class="text-gray-400 text-sm">Total Aprovado</span><i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i></div><p id="cardApproved" class="text-2xl font-bold text-green-400">R$ 0,00</p></div>
      <div class="bg-gray-800 rounded-xl p-4"><div class="flex items-center justify-between mb-2"><span class="text-gray-400 text-sm">Pendente</span><i data-lucide="clock" class="w-5 h-5 text-yellow-400"></i></div><p id="cardPending" class="text-2xl font-bold text-yellow-400">R$ 0,00</p></div>
      <div class="bg-gray-800 rounded-xl p-4"><div class="flex items-center justify-between mb-2"><span class="text-gray-400 text-sm">Total Pagamentos</span><i data-lucide="hash" class="w-5 h-5 text-cyan-400"></i></div><p id="cardTotal" class="text-2xl font-bold">0</p></div>
    </div>

    <!-- Tabela -->
    <div class="bg-gray-800 rounded-xl p-4">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">ID</th><th class="text-left py-3">Descrição</th><th class="text-left py-3">Valor</th><th class="text-left py-3">Método</th><th class="text-left py-3">Status</th><th class="text-left py-3">Data</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Novo Pagamento -->
  <div id="modalPayment" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Novo Pagamento Manual</h3><button onclick="closeModalPayment()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Valor (R$)</label><input id="payAmount" type="number" step="0.01" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Descrição</label><input id="payDescription" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Método</label><select id="payMethod" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none"><option value="manual">Manual</option><option value="pix">PIX</option><option value="cash">Dinheiro</option></select></div>
        <div><label class="block text-sm text-gray-400 mb-1">Status</label><select id="payStatus" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none"><option value="approved">Aprovado</option><option value="pending">Pendente</option></select></div>
      </div>
      <button onclick="createPayment()" class="mt-6 w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-medium">Criar Pagamento</button>
    </div>
  </div>

  <!-- Modal PIX -->
  <div id="modalPix" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md text-center">
      <h3 class="text-lg font-bold mb-4">QR Code PIX</h3>
      <img id="pixQrCode" src="" alt="QR Code" class="mx-auto mb-4 w-48 h-48 bg-white rounded-lg p-2">
      <div class="bg-gray-700 rounded-lg p-3 mb-4"><p class="text-xs text-gray-400 mb-1">Copia e Cola PIX:</p><p id="pixCopyPaste" class="text-sm break-all text-cyan-400"></p></div>
      <button onclick="copyPixCode()" class="w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium mb-2">Copiar Código PIX</button>
      <button onclick="document.getElementById('modalPix').classList.add('hidden')" class="w-full bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Fechar</button>
    </div>
  </div>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    lucide.createIcons(); initMenuMobile();

    async function loadPayments() {
      try {
        const res = await fetch(`${API_URL}/api/payments`, { headers });
        const data = await res.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        let totalApproved = 0, totalPending = 0;
        (data || []).forEach(p => {
          if (p.status === 'approved') totalApproved += parseFloat(p.amount || 0);
          if (p.status === 'pending') totalPending += parseFloat(p.amount || 0);
          const statusColor = p.status === 'approved' ? 'text-green-400' : p.status === 'pending' ? 'text-yellow-400' : 'text-red-400';
          const date = new Date(p.created_at).toLocaleDateString('pt-BR');
          let actions = '';
          if (p.status === 'pending') actions += `<button onclick="confirmPayment(${p.id})" class="px-2 py-1 bg-green-600 hover:bg-green-700 rounded text-xs mr-1">Confirmar</button>`;
          if (p.pix_copy_paste) actions += `<button onclick="showPix('${p.qr_code || ''}','${p.pix_copy_paste}')" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">PIX</button>`;
          tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="py-3">#${p.id}</td><td class="py-3">${p.description || '-'}</td><td class="py-3">R$ ${parseFloat(p.amount || 0).toFixed(2).replace('.',',')}</td><td class="py-3">${p.payment_method || '-'}</td><td class="py-3 ${statusColor}">${p.status}</td><td class="py-3">${date}</td><td class="py-3">${actions}</td></tr>`;
        });
        if (!data || data.length === 0) tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-gray-500">Nenhum pagamento registrado</td></tr>';

        document.getElementById('cardApproved').textContent = `R$ ${totalApproved.toFixed(2).replace('.',',')}`;
        document.getElementById('cardPending').textContent = `R$ ${totalPending.toFixed(2).replace('.',',')}`;
        document.getElementById('cardTotal').textContent = (data || []).length;
      } catch (err) { console.error('Erro:', err); }
    }

    function openModalPayment() { document.getElementById('modalPayment').classList.remove('hidden'); }
    function closeModalPayment() { document.getElementById('modalPayment').classList.add('hidden'); }

    async function createPayment() {
      try {
        const body = {
          amount: document.getElementById('payAmount').value,
          description: document.getElementById('payDescription').value,
          payment_method: document.getElementById('payMethod').value,
          status: document.getElementById('payStatus').value
        };
        const res = await fetch(`${API_URL}/api/create-payment`, { method: 'POST', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro ao criar pagamento');
        closeModalPayment(); loadPayments();
      } catch (err) { alert(err.message); }
    }

    async function confirmPayment(id) {
      if (!confirm('Confirmar este pagamento?')) return;
      try {
        await fetch(`${API_URL}/api/confirm-payment`, { method: 'POST', headers, body: JSON.stringify({ payment_id: id }) });
        loadPayments();
      } catch (err) { alert('Erro ao confirmar'); }
    }

    function showPix(qrCode, copyPaste) {
      if (qrCode) document.getElementById('pixQrCode').src = `data:image/png;base64,${qrCode}`;
      document.getElementById('pixCopyPaste').textContent = copyPaste;
      document.getElementById('modalPix').classList.remove('hidden');
    }

    function copyPixCode() {
      const text = document.getElementById('pixCopyPaste').textContent;
      navigator.clipboard.writeText(text).then(() => alert('Código PIX copiado!')).catch(() => alert('Erro ao copiar'));
    }

    function carregarPerfil() { const user = JSON.parse(localStorage.getItem('user') || '{}'); document.getElementById('profileUsername').value = user.username || ''; document.getElementById('profileEmail').value = user.email || ''; }
    function openModalPerfil() { carregarPerfil(); document.getElementById('modalPerfil').classList.remove('hidden'); }
    function closeModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
    async function salvarPerfil() { try { const body = {}; const e = document.getElementById('profileEmail').value; const p = document.getElementById('profilePassword').value; if(e) body.email=e; if(p) body.password=p; const res = await fetch(`${API_URL}/api/update-profile`,{method:'PUT',headers,body:JSON.stringify(body)}); if(!res.ok) throw new Error('Erro'); alert('Perfil atualizado!'); closeModalPerfil(); } catch(err){ alert(err.message); } }
    function sair() { fetch(`${API_URL}/api/logout`,{method:'POST',headers}).catch(()=>{}); localStorage.removeItem('token'); localStorage.removeItem('ms_token'); localStorage.removeItem('user'); window.location.href='login.html'; }
    function initMenuMobile() { const btn=document.getElementById('btnMenuMobile'); const sb=document.getElementById('sidebar'); if(btn) btn.addEventListener('click',()=>sb.classList.toggle('open')); }

    loadPayments();
  </script>
</body>
</html>
