<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Ações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .buy {
            color: green;
        }
        .sell {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Monitoramento de Ações para Day Trade</h1>
    <table>
        <thead>
            <tr>
                <th>Ação</th>
                <th>Preço Atual</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="stocks-table">
            <!-- Linhas das ações serão inseridas aqui pelo JavaScript -->
        </tbody>
    </table>

    <script>
        const API_KEY = 'GFY7TCO682NLRQW0'; // Sua chave da API da Alpha Vantage
        const stockPrices = {};

        // Função para obter os dados de uma ação da Alpha Vantage
        async function getStockPrice(stockSymbol) {
            const response = await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=${stockSymbol}&interval=5min&apikey=${API_KEY}`);
            const data = await response.json();
            const timeSeries = data['Time Series (5min)'];
            const latestTime = Object.keys(timeSeries)[0];
            const latestPrice = parseFloat(timeSeries[latestTime]['1. open']);
            return latestPrice;
        }

        // Função para atualizar a tabela com dados das ações
        function updateTable(stocks) {
            const tableBody = document.getElementById('stocks-table');
            tableBody.innerHTML = ''; // Limpa a tabela

            stocks.forEach(stock => {
                const row = document.createElement('tr');
                const nameCell = document.createElement('td');
                const priceCell = document.createElement('td');
                const statusCell = document.createElement('td');

                nameCell.textContent = stock.name;
                priceCell.textContent = stock.price.toFixed(2);
                statusCell.textContent = stock.status;
                statusCell.classList.add(stock.status === 'Comprar' ? 'buy' : 'sell');

                row.appendChild(nameCell);
                row.appendChild(priceCell);
                row.appendChild(statusCell);
                tableBody.appendChild(row);
            });
        }

        // Função para determinar se uma ação deve ser comprada ou vendida
        function determineStatus(stock) {
            const { name, price } = stock;

            if (!stockPrices[name]) {
                stockPrices[name] = [];
            }

            stockPrices[name].push(price);

            if (stockPrices[name].length > 10) {
                stockPrices[name].shift(); // Mantém apenas os últimos 10 preços
            }

            const initialPrice = stockPrices[name][0];
            const priceChange = price - initialPrice;

            if (priceChange >= 0.10) {
                return 'Vender';
            } else if (priceChange <= -0.10) {
                return 'Comprar';
            } else {
                return 'Aguardar';
            }
        }

        // Função para atualizar os dados das ações
        async function updateStocks() {
            const stockSymbols = ['AAPL', 'GOOGL', 'AMZN'];
            const stocks = [];

            for (const symbol of stockSymbols) {
                const price = await getStockPrice(symbol);
                const stock = { name: symbol, price: price };
                stock.status = determineStatus(stock);
                stocks.push(stock);
            }

            updateTable(stocks);
        }

        // Atualiza a tabela com os dados de exemplo
        updateStocks();

        // Intervalo para atualizar os dados das ações a cada 5 minutos (300000 ms)
        setInterval(updateStocks, 300000);
    </script>
</body>
</html>
