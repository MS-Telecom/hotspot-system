name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/ubuntu/hotspot-system
            TMP_DIR=/home/ubuntu/hotspot-system-temp
            ENV_BACKUP=/tmp/hotspot-backend.env

            echo "🔐 Preservando backend/.env"
            if [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" "$ENV_BACKUP"
            fi

            if [ ! -s "$ENV_BACKUP" ]; then
              echo "❌ ERRO: backend/.env não encontrado ou vazio. Abortando deploy para não quebrar a VPS."
              exit 1
            fi

            echo "⬇️ Clonando repositório"
            rm -rf "$TMP_DIR"
            git clone https://github.com/${{ github.repository }} "$TMP_DIR"

            echo "🧹 Limpando diretório da aplicação"
            rm -rf "$APP_DIR"
            mkdir -p "$APP_DIR"

            echo "📁 Copiando arquivos novos"
            cp -a "$TMP_DIR/." "$APP_DIR/"
            rm -rf "$TMP_DIR"

            echo "🔐 Restaurando backend/.env"
            mkdir -p "$APP_DIR/backend"
            cp "$ENV_BACKUP" "$APP_DIR/backend/.env"
            rm -f "$ENV_BACKUP"
            chmod 600 "$APP_DIR/backend/.env"

            echo "📦 Instalando dependências"
            cd "$APP_DIR"
            npm install --omit=dev

            echo "✅ Validando sintaxe do backend"
            node --check backend/server.js

            echo "🚀 Reiniciando PM2"
            pm2 delete hotspot || true
            pm2 start /home/ubuntu/hotspot-system/backend/server.js --name hotspot --cwd /home/ubuntu/hotspot-system/backend
            pm2 save

            echo "⏳ Aguardando API ficar pronta"
            sleep 5
            curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:3000/api/plans

            echo "✅ Deploy concluído em $(date)"
