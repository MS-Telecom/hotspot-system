name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/ubuntu/hotspot-system
            TMP_DIR=/home/ubuntu/hotspot-system-temp

            cp "$APP_DIR/backend/.env" /tmp/hotspot-backend.env || true

            rm -rf "$TMP_DIR"
            git clone https://github.com/${{ github.repository }} "$TMP_DIR"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -r "$TMP_DIR"/* "$APP_DIR"/
            rm -rf "$TMP_DIR"

            mkdir -p "$APP_DIR/backend"
            cp /tmp/hotspot-backend.env "$APP_DIR/backend/.env" || true
            rm -f /tmp/hotspot-backend.env

            cd "$APP_DIR"
            npm install --omit=dev

            pm2 delete hotspot || true
            pm2 start /home/ubuntu/hotspot-system/backend/server.js --name hotspot --cwd /home/ubuntu/hotspot-system/backend
            pm2 save
