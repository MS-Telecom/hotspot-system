name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/ubuntu/hotspot-system
            TMP_DIR=/home/ubuntu/hotspot-system-temp

            rm -rf "$TMP_DIR"
            git clone https://github.com/${{ github.repository }} "$TMP_DIR"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 ! -name ".env" ! -path "$APP_DIR/backend/backups*" ! -path "$APP_DIR/backend/tmp*" -exec rm -rf {} +
            cp -r "$TMP_DIR"/* "$APP_DIR"/
            rm -rf "$TMP_DIR"

            cd "$APP_DIR"
            npm install --omit=dev

            pm2 delete hotspot || true
            pm2 start backend/server.js --name hotspot
            pm2 save
