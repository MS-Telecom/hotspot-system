<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .gradient-bg{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);}</style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <header class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <i data-lucide="wifi" class="w-8 h-8 text-cyan-400"></i>
      <span class="text-xl font-bold">MS TELECOM</span>
    </div>
    <nav class="flex items-center gap-4">
      <a href="index.html" class="hover:text-cyan-400 transition">Início</a>
      <a href="portal.html" class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-medium transition">Conectar</a>
    </nav>
  </header>

  <section class="max-w-7xl mx-auto px-6 py-16">
    <h1 class="text-3xl font-bold text-center mb-12">Nossos Planos</h1>
    <div id="plansList" class="grid md:grid-cols-3 gap-6">
      <div class="text-center text-gray-400 col-span-3 py-12">Carregando planos...</div>
    </div>
  </section>

  <footer class="text-center py-8 text-gray-400 border-t border-gray-700 mt-16">
    <p>&copy; 2026 MS TELECOM - Hotspot System</p>
  </footer>

  <script>
    // CORRIGIDO: URL da API agora aponta para o endpoint padronizado do novo backend
    // Antigo: https://mstelecom-api.duckdns.org/api/portal/plans
    // Novo: /api/plans (rota pública, sem autenticação, retorna array diretamente)
    const API_URL = 'https://mstelecom-api.duckdns.org';
    
    // Inicializa os ícones do Lucide
    lucide.createIcons();

    /**
     * Carrega a lista de planos do backend padronizado.
     * - Endpoint: GET /api/plans
     * - Resposta esperada: array de objetos com campos em inglês (name, price, duration_days, speed_mbps, description)
     * - Compatibilidade: se a resposta for um objeto com campo 'data', extrai o array; caso contrário, usa a resposta diretamente.
     */
    async function loadPlans() {
      try {
        const response = await fetch(`${API_URL}/api/plans`);
        
        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }
        
        let plans = await response.json();
        
        // Garantia de compatibilidade: se a resposta for um objeto com a propriedade 'data', extraímos o array
        // (algumas rotas do novo backend podem retornar { success, data } - embora a tabela indique array direto)
        if (plans && typeof plans === 'object' && !Array.isArray(plans) && plans.data) {
          plans = plans.data;
        }
        
        // Se ainda não for array, trata como vazio
        if (!Array.isArray(plans)) {
          plans = [];
        }
        
        const container = document.getElementById('plansList');
        container.innerHTML = '';
        
        if (plans.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-400 col-span-3 py-12">Nenhum plano disponível</div>';
          return;
        }
        
        // Renderiza cada plano usando os campos padronizados em inglês
        plans.forEach((plan, index) => {
          // Destaque para o segundo plano (índice 1) como "Popular"
          const highlight = index === 1 ? 'border-cyan-400 bg-cyan-500/10' : 'border-gray-700 bg-white/5';
          const badge = index === 1 
            ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-cyan-500 text-white text-xs px-3 py-1 rounded-full font-medium">Popular</span>' 
            : '';
          
          // Formatação do preço (R$)
          const formattedPrice = `R$ ${parseFloat(plan.price).toFixed(2).replace('.', ',')}`;
          
          // Campo de velocidade: se existir e for numérico, exibe "X Mbps", senão "Ilimitada"
          const speedText = plan.speed_mbps ? `${plan.speed_mbps} Mbps` : 'Ilimitada';
          
          // Descrição amigável: usa o campo description se existir, senão mensagem padrão
          const descriptionText = plan.description || 'Acesso completo';
          
          container.innerHTML += `
            <div class="relative border ${highlight} rounded-xl p-6 text-center">
              ${badge}
              <h3 class="text-xl font-bold mb-2">${escapeHtml(plan.name)}</h3>
              <p class="text-4xl font-bold text-cyan-400 mb-1">${formattedPrice}</p>
              <p class="text-gray-400 mb-6">${plan.duration_days || '-'} dias</p>
              <ul class="text-left space-y-2 mb-6">
                <li class="flex items-center gap-2 text-gray-300"><i data-lucide="check" class="w-4 h-4 text-green-400"></i>Velocidade: ${speedText}</li>
                <li class="flex items-center gap-2 text-gray-300"><i data-lucide="check" class="w-4 h-4 text-green-400"></i>${escapeHtml(descriptionText)}</li>
              </ul>
              <a href="portal.html" class="block bg-cyan-500 hover:bg-cyan-600 py-3 rounded-lg font-semibold transition">Assinar</a>
            </div>
          `;
        });
        
        // Recria os ícones para os novos elementos adicionados
        lucide.createIcons();
        
      } catch (error) {
        console.error('Erro ao carregar planos:', error);
        const container = document.getElementById('plansList');
        container.innerHTML = `<div class="text-center text-red-400 col-span-3 py-12">Falha ao carregar planos. Tente novamente mais tarde.</div>`;
      }
    }
    
    /**
     * Função auxiliar para escapar caracteres HTML e evitar XSS
     * @param {string} str - String a ser escapada
     * @returns {string} String segura
     */
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    
    // Inicia o carregamento dos planos assim que a página estiver pronta
    loadPlans();
  </script>
</body>
</html>
