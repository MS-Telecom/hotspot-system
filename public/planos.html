<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos - MS TELECOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0c15 0%,#020617 100%);}</style>
</head>
<body class="text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="text-center mb-10">
            <div class="flex justify-center mb-4"><div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="zap" class="text-white w-10 h-10"></i></div></div>
            <h1 class="text-3xl font-black tracking-tight">MS <span class="text-blue-500">TELECOM</span></h1>
            <p class="text-gray-500 mt-2">Escolha o plano ideal para sua conexão</p>
        </div>
        <div id="plansList" class="grid md:grid-cols-3 gap-6">
            <div class="text-center text-gray-400 py-12 col-span-3">Carregando planos...</div>
        </div>
        <div class="text-center mt-8"><a href="portal.html" class="text-blue-500 hover:underline">Voltar ao portal</a></div>
    </div>
    <script>
        const API_URL = 'https://mstelecom-api.duckdns.org';
        lucide.createIcons();
        async function loadPlans() {
            try {
                const res = await fetch(`${API_URL}/api/plans`);
                let plans = await res.json();
                if (plans && typeof plans === 'object' && !Array.isArray(plans) && plans.data) plans = plans.data;
                const container = document.getElementById('plansList');
                if (!plans || plans.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 col-span-3">Nenhum plano disponível</div>'; return; }
                container.innerHTML = plans.map(plan => `
                    <div class="bg-white/10 backdrop-blur rounded-2xl p-6 border border-gray-700 text-center">
                        <h3 class="text-xl font-bold">${plan.name}</h3>
                        <p class="text-3xl font-bold text-cyan-400 my-3">R$ ${parseFloat(plan.price).toFixed(2).replace('.',',')}</p>
                        <p class="text-gray-400">${plan.duration_days} dias</p>
                        <p class="text-gray-400">${plan.speed_mbps} Mbps</p>
                        <p class="text-sm text-gray-500 mt-4">${plan.description || ''}</p>
                        <a href="portal.html" class="mt-6 inline-block bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-2 rounded-lg font-bold">Assinar</a>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch(err) { console.error(err); }
        }
        loadPlans();
    </script>
</body>
</html>
