<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .gradient-bg{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);}</style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <header class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <i data-lucide="wifi" class="w-8 h-8 text-cyan-400"></i>
      <span class="text-xl font-bold">MS TELECOM</span>
    </div>
    <nav class="flex items-center gap-4">
      <a href="index.html" class="hover:text-cyan-400 transition">Início</a>
      <a href="portal.html" class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-medium transition">Conectar</a>
    </nav>
  </header>

  <section class="max-w-7xl mx-auto px-6 py-16">
    <h1 class="text-3xl font-bold text-center mb-12">Nossos Planos</h1>
    <div id="plansList" class="grid md:grid-cols-3 gap-6">
      <div class="text-center text-gray-400 col-span-3 py-12">Carregando planos...</div>
    </div>
  </section>

  <footer class="text-center py-8 text-gray-400 border-t border-gray-700 mt-16">
    <p>&copy; 2026 MS TELECOM - Hotspot System</p>
  </footer>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    lucide.createIcons();

    async function loadPlans() {
      try {
        const res = await fetch(`${API_URL}/api/portal/plans`);
        const plans = await res.json();
        const container = document.getElementById('plansList');
        container.innerHTML = '';
        if (!plans || plans.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 col-span-3 py-12">Nenhum plano disponível</div>'; return; }
        plans.forEach((p, i) => {
          const highlight = i === 1 ? 'border-cyan-400 bg-cyan-500/10' : 'border-gray-700 bg-white/5';
          const badge = i === 1 ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-cyan-500 text-white text-xs px-3 py-1 rounded-full font-medium">Popular</span>' : '';
          container.innerHTML += `<div class="relative border ${highlight} rounded-xl p-6 text-center">
            ${badge}
            <h3 class="text-xl font-bold mb-2">${p.name}</h3>
            <p class="text-4xl font-bold text-cyan-400 mb-1">R$ ${parseFloat(p.price).toFixed(2).replace('.',',')}</p>
            <p class="text-gray-400 mb-6">${p.duration_days || '-'} dias</p>
            <ul class="text-left space-y-2 mb-6">
              <li class="flex items-center gap-2 text-gray-300"><i data-lucide="check" class="w-4 h-4 text-green-400"></i>Velocidade: ${p.speed_mbps ? p.speed_mbps + ' Mbps' : 'Ilimitada'}</li>
              <li class="flex items-center gap-2 text-gray-300"><i data-lucide="check" class="w-4 h-4 text-green-400"></i>${p.description || 'Acesso completo'}</li>
            </ul>
            <a href="portal.html" class="block bg-cyan-500 hover:bg-cyan-600 py-3 rounded-lg font-semibold transition">Assinar</a>
          </div>`;
        });
        lucide.createIcons();
      } catch (err) { console.error(err); }
    }

    loadPlans();
  </script>
</body>
</html>
