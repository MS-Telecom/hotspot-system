<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - MS TELECOM</title>
    <link rel="stylesheet" href="/assets/portal.css">
    <style>
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0a0c15 0%,#020617 100%);}
        .max-w-md{max-width:28rem}.w-20{width:5rem}.h-20{height:5rem}.mx-auto{margin-left:auto;margin-right:auto}.bg-white\/10{background:rgba(255,255,255,.10)}
        .bg-red-500\/20{background:rgba(239,68,68,.20)}.text-red-400{color:#f87171}.bg-cyan-500{background:#06b6d4}.hover\:bg-cyan-600:hover{background:#0891b2}
        .bg-gray-700{background:#374151}.hover\:bg-gray-600:hover{background:#4b5563}.backdrop-blur{backdrop-filter:blur(12px)}.font-semibold{font-weight:600}
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full px-4 text-center">
        <div class="bg-white/10 backdrop-blur rounded-2xl p-8">
            <div class="w-20 h-20 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-6"><svg class="w-12 h-12 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></div>
            <h1 class="text-2xl font-bold">Ocorreu um Erro</h1>
            <p id="errorMessage" class="text-gray-300 mt-2">Não foi possível processar sua solicitação. Tente novamente.</p>
            <div class="flex flex-col gap-3 mt-6"><a href="portal.html" class="bg-cyan-500 hover:bg-cyan-600 px-6 py-3 rounded-lg font-semibold transition">Tentar Novamente</a><a href="portal.html" class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg font-semibold transition">Página Inicial</a></div>
        </div>
    </div>
    <script>
        const msg = new URLSearchParams(window.location.search).get('msg');
        if(msg) document.getElementById('errorMessage').innerText = decodeURIComponent(msg);
    </script>
</body>
</html>
