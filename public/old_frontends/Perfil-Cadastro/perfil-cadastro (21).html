<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Cadastro - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="settings" class="w-5 h-5"></i>ConfiguraÃ§Ãµes</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
      <a href="perfil-cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="clipboard-list" class="w-5 h-5"></i>Perfil de Cadastro</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
  <base href="/">
      <div class="flex items-center gap-3">
        <button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <div>
          <h1 class="text-2xl font-bold">Perfil de Cadastro</h1>
          <p class="text-gray-400 text-sm">Configure quais campos serÃ£o exibidos no formulÃ¡rio de cadastro de clientes</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <!-- Busca -->
    <div class="mb-4">
      <input type="text" id="searchInput" placeholder="Buscar campo por nome ou identificador..." class="w-full md:w-96 px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-cyan-400">
    </div>

    <!-- Estado de carregamento -->
    <div id="fieldsLoadingState" class="text-center py-12">
      <div class="animate-spin w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full mx-auto"></div>
      <p class="text-gray-500 mt-3">Carregando configuraÃ§Ãµes...</p>
    </div>

    <!-- Container dos campos -->
    <div id="fieldsContainer" class="space-y-3 hidden"></div>

    <!-- BotÃµes de aÃ§Ã£o -->
    <div id="actionButtons" class="flex gap-3 mt-6 hidden">
      <button id="saveBtn" onclick="saveSettings()" class="flex items-center gap-2 px-6 py-3 bg-cyan-500 hover:bg-cyan-600 rounded-lg font-medium"><i data-lucide="check" class="w-5 h-5"></i>Salvar ConfiguraÃ§Ãµes</button>
      <button onclick="window.history.back()" class="flex items-center gap-2 px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium"><i data-lucide="x" class="w-5 h-5"></i>Cancelar</button>
    </div>
  </main>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">UsuÃ¡rio</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    // VariÃ¡veis globais para campos
    let allFields = [];

    lucide.createIcons();
    initMenuMobile();

    // Escapar HTML para evitar XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Carregar campos do servidor
    async function loadFields() {
      const loadingState = document.getElementById('fieldsLoadingState');
      const container = document.getElementById('fieldsContainer');
      const actionButtons = document.getElementById('actionButtons');
      try {
        loadingState.classList.remove('hidden');
        container.classList.add('hidden');
        actionButtons.classList.add('hidden');

        const res = await fetch(`${API_URL}/api/settings/fields`, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

        const payload = await res.json();
        allFields = payload.data || payload || [];
        console.log('[Perfil Cadastro] Campos carregados:', allFields.length);

        loadingState.classList.add('hidden');
        container.classList.remove('hidden');
        actionButtons.classList.remove('hidden');
        renderFields(allFields);
      } catch (error) {
        console.error('[Perfil Cadastro] Erro ao carregar campos:', error);
        loadingState.innerHTML = `
          <div class="text-center py-12">
            <i data-lucide="alert-circle" class="w-12 h-12 mx-auto text-red-500"></i>
            <p class="text-red-400 mt-2">Erro ao carregar configuraÃ§Ãµes</p>
            <p class="text-gray-500 text-sm mt-1">${escapeHtml(error.message)}</p>
            <button onclick="loadFields()" class="mt-4 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm">Tentar novamente</button>
          </div>`;
        lucide.createIcons();
      }
    }

    // Renderizar lista de campos com toggles
    function renderFields(fields) {
      const container = document.getElementById('fieldsContainer');
      if (!fields || fields.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-gray-800 rounded-xl"><p class="text-gray-500">Nenhum campo encontrado</p></div>';
        return;
      }
      container.innerHTML = fields.map(field => `
        <div class="bg-gray-800 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 field-item" data-field-name="${escapeHtml(field.label?.toLowerCase())}" data-field-id="${escapeHtml(field.field?.toLowerCase())}">
          <div class="flex-1">
            <h3 class="font-bold text-sm">${escapeHtml(field.label)}</h3>
            <p class="text-xs text-gray-500 font-mono mt-1">${escapeHtml(field.field)}</p>
          </div>
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="enabled-toggle w-5 h-5 rounded accent-cyan-500 cursor-pointer" data-field="${escapeHtml(field.field)}" ${field.enabled ? 'checked' : ''}>
              <span class="text-sm text-gray-400">Habilitado</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="required-toggle w-5 h-5 rounded accent-cyan-500 cursor-pointer" data-field="${escapeHtml(field.field)}" ${field.required ? 'checked' : ''}>
              <span class="text-sm text-gray-400">ObrigatÃ³rio</span>
            </label>
          </div>
        </div>
      `).join('');
    }

    // Busca/filtro local de campos
    document.getElementById('searchInput').addEventListener('input', function() {
      const term = this.value.toLowerCase().trim();
      if (!term) { renderFields(allFields); return; }
      const filtered = allFields.filter(f => (f.label||'').toLowerCase().includes(term) || (f.field||'').toLowerCase().includes(term));
      if (filtered.length === 0) {
        document.getElementById('fieldsContainer').innerHTML = `
          <div class="text-center py-12 bg-gray-800 rounded-xl">
            <p class="text-gray-500">Nenhum campo encontrado para "${escapeHtml(this.value)}"</p>
            <button onclick="document.getElementById('searchInput').value=''; renderFields(allFields);" class="mt-3 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm">Limpar busca</button>
          </div>`;
      } else {
        renderFields(filtered);
      }
    });

    // Salvar configuraÃ§Ãµes de campos
    async function saveSettings() {
      const saveBtn = document.getElementById('saveBtn');
      const originalHtml = saveBtn.innerHTML;
      try {
        saveBtn.innerHTML = '<div class="animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></div> Salvando...';
        saveBtn.disabled = true;

        const fields = [];
        document.querySelectorAll('.enabled-toggle').forEach(toggle => {
          const fieldName = toggle.dataset.field;
          const enabled = toggle.checked;
          const requiredToggle = document.querySelector(`.required-toggle[data-field="${fieldName}"]`);
          const required = requiredToggle ? requiredToggle.checked : false;
          const previousField = allFields.find(f => f.field === fieldName) || {};
          fields.push({
            field: fieldName,
            label: previousField.label || fieldName,
            enabled,
            required,
            sort_order: previousField.sort_order || 0
          });
        });

        const res = await fetch(`${API_URL}/api/settings/fields`, {
          method: 'PUT',
          headers,
          body: JSON.stringify(fields)
        });

        if (res.ok) {
          alert('ConfiguraÃ§Ãµes salvas com sucesso!');
          await loadFields();
        } else {
          const errorText = await res.text();
          alert(`Erro ao salvar: ${res.status} - ${errorText}`);
        }
      } catch (error) {
        console.error('[Perfil Cadastro] Erro ao salvar:', error);
        alert('Erro ao salvar configuraÃ§Ãµes. Verifique sua conexÃ£o.');
      } finally {
        saveBtn.innerHTML = originalHtml;
        saveBtn.disabled = false;
        lucide.createIcons();
      }
    }

    // FunÃ§Ãµes padrÃ£o admin: perfil e logout
    function carregarPerfil() { const user = JSON.parse(localStorage.getItem('user')||'{}'); document.getElementById('profileUsername').value=user.username||''; document.getElementById('profileEmail').value=user.email||''; }
    function openModalPerfil() { carregarPerfil(); document.getElementById('modalPerfil').classList.remove('hidden'); }
    function closeModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
    async function salvarPerfil() { try { const body={}; const e=document.getElementById('profileEmail').value; const p=document.getElementById('profilePassword').value; if(e) body.email=e; if(p) body.password=p; const res=await fetch(`${API_URL}/api/update-profile`,{method:'PUT',headers,body:JSON.stringify(body)}); if(!res.ok) throw new Error('Erro'); alert('Perfil atualizado!'); closeModalPerfil(); } catch(err){ alert(err.message); } }
    function sair() { fetch(`${API_URL}/api/logout`,{method:'POST',headers}).catch(()=>{}); localStorage.removeItem('token'); localStorage.removeItem('ms_token'); localStorage.removeItem('user'); window.location.href='login.html'; }
    function initMenuMobile() { const btn=document.getElementById('btnMenuMobile'); const sb=document.getElementById('sidebar'); if(btn) btn.addEventListener('click',()=>sb.classList.toggle('open')); }

    // InicializaÃ§Ã£o
    loadFields();
  </script>
</body>
</html>
