<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MS Telecom | Hotspots / POPs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0c15; }
        .glass-card { background: rgba(15, 25, 35, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(59,130,246,0.2); }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.2), transparent); border-left: 3px solid #3b82f6; color: #3b82f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-200">
<script>
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://localhost:3000' 
        : 'https://mstelecom-api.duckdns.org';
</script>

<div class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-72 bg-[#0f1119] hidden md:flex md:flex-col border-r border-gray-800 shrink-0">
        <div class="p-6 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg">
                    <i data-lucide="zap" class="text-white w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight">MS <span class="text-blue-500">TELECOM</span></h1>
                    <p class="text-[9px] text-gray-500 uppercase tracking-wider">NOC Commander</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto custom-scrollbar">
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
            <a href="hotspots.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all"><i data-lucide="router" class="w-5 h-5"></i> Hotspots / POPs</a>
            <a href="cliente-detalhe.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all"><i data-lucide="users" class="w-5 h-5"></i> Clientes / SGP</a>
            <a href="financeiro.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all"><i data-lucide="banknote" class="w-5 h-5"></i> Financeiro</a>
            <a href="configuracoes.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all"><i data-lucide="settings" class="w-5 h-5"></i> ConfiguraÃ§Ãµes</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto bg-[#0a0c15]">
        <header class="sticky top-0 z-10 bg-[#0a0c15]/95 backdrop-blur-sm border-b border-gray-800 px-8 py-4 flex justify-between items-center">
  <base href="/">
            <div class="relative w-96">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4"></i>
                <input type="text" id="searchInput" placeholder="Buscar hotspot..." class="w-full bg-gray-900/50 border border-gray-700 rounded-xl pl-11 pr-4 py-2.5 text-sm outline-none focus:border-blue-500 transition">
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-xs font-bold text-white" id="userName">Administrador</p>
                    <p class="text-[9px] text-emerald-500 font-bold uppercase">Sistema Operacional</p>
                </div>
                <button onclick="sair()" class="p-2 hover:bg-red-500/20 rounded-lg transition"><i data-lucide="log-out" class="w-5 h-5 text-red-400"></i></button>
            </div>
        </header>

        <div class="p-8 space-y-8">
            <div class="flex justify-between items-end">
                <div><h1 class="text-3xl font-black tracking-tight">Hotspots / POPs</h1><p class="text-gray-500 text-sm mt-1">GestÃ£o de concentradores MikroTik</p></div>
                <button onclick="openModalNovoHotspot()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg hover:bg-blue-700 transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Novo Hotspot</button>
            </div>
            <div id="popsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center text-gray-500 py-8 col-span-3">Carregando POPs...</div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL: NOVO HOTSPOT -->
<div id="modalNovoHotspot" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
    <div class="bg-[#0f1119] rounded-3xl w-full max-w-md border border-gray-700 shadow-2xl p-6 space-y-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="router" class="text-blue-500"></i> Novo Hotspot</h2>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-2">Nome</label><input type="text" id="hotspotNome" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm"></div>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-2">LocalizaÃ§Ã£o</label><input type="text" id="hotspotLocalizacao" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm"></div>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-2">IP do POP</label><input type="text" id="hotspotIp" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm"></div>
        <div class="flex justify-end gap-3 pt-4">
            <button onclick="closeModalNovoHotspot()" class="px-4 py-2 text-sm font-bold text-gray-400 hover:text-white transition">Cancelar</button>
            <button onclick="salvarNovoHotspot()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold text-sm transition">Salvar</button>
        </div>
    </div>
</div>

<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function carregarPOPs() {
        try {
            const res = await fetch(`${API_URL}/api/pops`, { headers: { 'Authorization': `Bearer ${token}` } });
            const pops = await res.json();
            const container = document.getElementById('popsGrid');
            if (!pops || pops.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8 col-span-3">Nenhum POP cadastrado.</div>';
                return;
            }
            container.innerHTML = pops.map(pop => `
                <div class="glass-card rounded-2xl p-6 border border-gray-800 hover:border-blue-500/50 transition-all">
                    <div class="flex justify-between items-start mb-4">
                        <div><h3 class="text-lg font-bold text-white">${escapeHtml(pop.name)}</h3><p class="text-xs text-gray-500">IP: ${escapeHtml(pop.ip)}</p></div>
                        <span class="px-3 py-1 ${pop.status === 'online' ? 'bg-emerald-500/20 text-emerald-500' : 'bg-red-500/20 text-red-500'} text-[10px] font-bold rounded-full">${pop.status?.toUpperCase() || 'OFFLINE'}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-6">ðŸ“ ${escapeHtml(pop.location)}</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="testarConexao(${pop.id})" class="py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-[10px] font-bold transition">TESTAR</button>
                        <button onclick="gerarScript(${pop.id})" class="py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[10px] font-bold transition">SCRIPT</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        } catch (e) { console.error(e); }
    }

    function openModalNovoHotspot() { document.getElementById('modalNovoHotspot').classList.remove('hidden'); lucide.createIcons(); }
    function closeModalNovoHotspot() { document.getElementById('modalNovoHotspot').classList.add('hidden'); }

    async function salvarNovoHotspot() {
        const name = document.getElementById('hotspotNome').value;
        const location = document.getElementById('hotspotLocalizacao').value;
        const ip = document.getElementById('hotspotIp').value;
        if (!name || !location || !ip) return alert('Preencha todos os campos');
        try {
            const res = await fetch(`${API_URL}/api/pops`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, location, ip, status: 'offline' })
            });
            if (res.ok) { alert('âœ… Hotspot criado!'); closeModalNovoHotspot(); carregarPOPs(); }
            else alert('âŒ Erro ao criar');
        } catch (e) { alert('âŒ Erro de conexÃ£o'); }
    }

    async function testarConexao(id) {
        try {
            const res = await fetch(`${API_URL}/api/pops/${id}/heartbeat`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { alert('âœ… Heartbeat enviado!'); carregarPOPs(); }
            else alert('âŒ Falha no teste');
        } catch (e) { alert('âŒ Erro de conexÃ£o'); }
    }

    async function gerarScript(id) {
        try {
            const res = await fetch(`${API_URL}/api/pops/${id}/script`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.script) {
                const win = window.open('', '_blank');
                win.document.write('<pre>' + data.script + '</pre>');
                win.document.title = 'Script MikroTik';
            }
        } catch (e) { alert('âŒ Erro ao gerar script'); }
    }

    function sair() { localStorage.clear(); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        carregarPOPs();
        lucide.createIcons();
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.username) document.getElementById('userName').innerText = user.username;
    });
</script>
</body>
</html>
