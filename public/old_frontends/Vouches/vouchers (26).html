  <!-- Modal Gerar -->
  <div id="modalVoucher" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">Gerar Vouchers</h3><button onclick="closeModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Plano</label><input id="inputPlanName" type="text" placeholder="Nome do plano" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Valor (R$)</label><input id="inputAmount" type="number" step="0.01" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Quantidade</label><input id="inputQuantity" type="number" value="1" min="1" max="100" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">UsuÃ¡rio</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    };
    lucide.createIcons();
    initMenuMobile();

    async function loadVouchers() {
      try {
        const res = await fetch(`${API_URL}/api/vouchers`, {
          headers
        });
        const vouchers = await res.json();
        const tbody = document.getElementById('vouchersTable');
        tbody.innerHTML = '';
        if (!vouchers || vouchers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="py-8 text-center text-gray-500">Nenhum voucher gerado</td></tr>';
          return;
        }
        vouchers.forEach(v => {
          const usedColor = v.used ? 'text-red-400' : 'text-green-400';
          const expires = v.expires_at ? new Date(v.expires_at).toLocaleDateString('pt-BR') : '-';
          tbody.innerHTML += `
            <tr class="border-b border-gray-700">
              <td class="py-3 font-mono">${v.code}</td>
              <td class="py-3">${v.plan_name || '-'}</td>
              <td class="py-3">R$ ${parseFloat(v.amount||0).toFixed(2).replace('.',',')}</td>
              <td class="py-3">${expires}</td>
              <td class="py-3 ${usedColor}">${v.used ? 'Sim' : 'NÃ£o'}</td>
              <td class="py-3">${v.used_by || '-'}</td>
              <td class="py-3">${v.used_at ? new Date(v.used_at).toLocaleString('pt-BR') : '-'}</td>
              <td class="py-3 text-center">
                <button onclick="deleteVoucher(${v.id})" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button>
              </td>
            </tr>`;
        });
      } catch (err) {
        console.error('Erro:', err);
      }
    }

    function openModal() {
      document.getElementById('modalVoucher').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalVoucher').classList.add('hidden');
    }

    async function generateVouchers() {
      try {
        const body = {
          plan_name: document.getElementById('inputPlanName').value,
          amount: document.getElementById('inputAmount').value,
          quantity: document.getElementById('inputQuantity').value,
          expires_at: document.getElementById('inputExpires').value || null
        };
        const res = await fetch(`${API_URL}/api/vouchers`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Erro ao gerar');
        closeModal();
        loadVouchers();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteVoucher(id) {
      if (!confirm('Excluir este voucher?')) return;
      try {
        await fetch(`${API_URL}/api/vouchers/${id}`, {
          method: 'DELETE',
          headers
        });
        loadVouchers();
      } catch (err) {
        alert('Erro');
      }
    }

    function carregarPerfil() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('profileUsername').value = user.username || '';
      document.getElementById('profileEmail').value = user.email || '';
    }

    function openModalPerfil() {
      carregarPerfil();
      document.getElementById('modalPerfil').classList.remove('hidden');
    }

    function closeModalPerfil() {
      document.getElementById('modalPerfil').classList.add('hidden');
    }

    async function salvarPerfil() {
      try {
        const body = {};
        const email = document.getElementById('profileEmail').value;
        const password = document.getElementById('profilePassword').value;
        if (email) body.email = email;
        if (password) body.password = password;
        const res = await fetch(`${API_URL}/api/update-profile`, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Erro');
        alert('Perfil atualizado!');
        closeModalPerfil();
      } catch (err) {
        alert(err.message);
      }
    }

    function sair() {
      fetch(`${API_URL}/api/logout`, {
        method: 'POST',
        headers
      }).catch(() => {});
      localStorage.removeItem('token');
      localStorage.removeItem('ms_token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    function initMenuMobile() {
      const btn = document.getElementById('btnMenuMobile');
      const sb = document.getElementById('sidebar');
      if (btn) btn.addEventListener('click', () => sb.classList.toggle('open'));
    }

    loadVouchers();
  </script>
