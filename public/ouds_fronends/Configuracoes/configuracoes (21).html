<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">
  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="settings" class="w-5 h-5"></i>Configurações</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3"><button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button><h1 class="text-2xl font-bold">Configurações</h1></div>
      <div class="flex items-center gap-3">
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <!-- Planos -->
    <div class="bg-gray-800 rounded-xl p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Planos</h3>
        <button onclick="openModalPlan()" class="flex items-center gap-2 px-3 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm"><i data-lucide="plus" class="w-4 h-4"></i>Novo Plano</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">Nome</th><th class="text-left py-3">Preço</th><th class="text-left py-3">Duração</th><th class="text-left py-3">Velocidade</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tablePlans"></tbody>
        </table>
      </div>
    </div>

    <!-- Configurações Gerais -->
    <div class="bg-gray-800 rounded-xl p-6 mb-6">
      <h3 class="text-lg font-semibold mb-4">Configurações Gerais</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">Chave</th><th class="text-left py-3">Valor</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tableSettings"></tbody>
        </table>
      </div>
      <div class="flex gap-3 mt-4">
        <input id="newSettingKey" type="text" placeholder="Chave" class="px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400 text-sm">
        <input id="newSettingValue" type="text" placeholder="Valor" class="flex-1 px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400 text-sm">
        <button onclick="addSetting()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm">Adicionar</button>
      </div>
    </div>

    <!-- Admins -->
    <div class="bg-gray-800 rounded-xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Administradores</h3>
        <button onclick="openModalAdmin()" class="flex items-center gap-2 px-3 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm"><i data-lucide="plus" class="w-4 h-4"></i>Novo Admin</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">Usuário</th><th class="text-left py-3">E-mail</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tableAdmins"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Novo Plano -->
  <div id="modalPlan" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold" id="planModalTitle">Novo Plano</h3><button onclick="closeModalPlan()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <input type="hidden" id="planEditId">
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Nome</label><input id="planName" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Preço (R$)</label><input id="planPrice" type="number" step="0.01" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Duração (dias)</label><input id="planDuration" type="number" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Velocidade (ex: 10M/10M)</label><input id="planSpeed" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Descrição</label><textarea id="planDescription" rows="2" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></textarea></div>
      </div>
      <button onclick="savePlan()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button>
    </div>
  </div>

  <!-- Modal Novo Admin -->
  <div id="modalAdmin" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Novo Administrador</h3><button onclick="closeModalAdmin()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="adminUsername" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Senha</label><input id="adminPassword" type="password" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="adminEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <button onclick="createAdmin()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Criar</button>
    </div>
  </div>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6"><button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button><button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    lucide.createIcons(); initMenuMobile();

    // === PLANOS ===
    async function loadPlans() {
      try {
        const res = await fetch(`${API_URL}/api/plans`, { headers });
        const data = await res.json();
        const tbody = document.getElementById('tablePlans');
        tbody.innerHTML = '';
        if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-gray-500">Nenhum plano</td></tr>'; return; }
        data.forEach(p => {
          tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="py-3">${p.name}</td><td class="py-3">R$ ${parseFloat(p.price).toFixed(2).replace('.',',')}</td><td class="py-3">${p.duration_days || '-'} dias</td><td class="py-3">${p.speed_mbps ? p.speed_mbps + ' Mbps' : '-'}</td>
            <td class="py-3 flex gap-1"><button onclick='editPlan(${JSON.stringify(p)})' class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">Editar</button><button onclick="deletePlan(${p.id})" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button></td></tr>`;
        });
      } catch (err) { console.error(err); }
    }

    function openModalPlan() { document.getElementById('planEditId').value=''; document.getElementById('planModalTitle').textContent='Novo Plano'; document.getElementById('planName').value=''; document.getElementById('planPrice').value=''; document.getElementById('planDuration').value=''; document.getElementById('planSpeed').value=''; document.getElementById('planDescription').value=''; document.getElementById('modalPlan').classList.remove('hidden'); }
    function closeModalPlan() { document.getElementById('modalPlan').classList.add('hidden'); }

    function editPlan(p) { document.getElementById('planEditId').value=p.id; document.getElementById('planModalTitle').textContent='Editar Plano'; document.getElementById('planName').value=p.name||''; document.getElementById('planPrice').value=p.price||''; document.getElementById('planDuration').value=p.duration_days||''; document.getElementById('planSpeed').value=p.speed_mbps||''; document.getElementById('planDescription').value=p.description||''; document.getElementById('modalPlan').classList.remove('hidden'); }

    async function savePlan() {
      try {
        const id = document.getElementById('planEditId').value;
        const body = { name: document.getElementById('planName').value, price: document.getElementById('planPrice').value, duration_days: document.getElementById('planDuration').value, speed_mbps: document.getElementById('planSpeed').value, description: document.getElementById('planDescription').value };
        const url = id ? `${API_URL}/api/plans/${id}` : `${API_URL}/api/plans`;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro');
        closeModalPlan(); loadPlans();
      } catch (err) { alert(err.message); }
    }

    async function deletePlan(id) { if (!confirm('Excluir plano?')) return; try { await fetch(`${API_URL}/api/plans/${id}`, { method: 'DELETE', headers }); loadPlans(); } catch (err) { alert('Erro'); } }

    // === SETTINGS ===
    async function loadSettings() {
      try {
        const res = await fetch(`${API_URL}/api/settings`, { headers });
        const data = await res.json();
        const tbody = document.getElementById('tableSettings');
        tbody.innerHTML = '';
        if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">Nenhuma configuração</td></tr>'; return; }
        data.forEach(s => {
          tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="py-3 font-mono text-sm">${s.key}</td><td class="py-3"><input type="text" value="${s.value||''}" onchange="updateSetting('${s.key}',this.value)" class="px-2 py-1 bg-gray-700 rounded text-sm focus:outline-none focus:ring-1 focus:ring-cyan-400 w-full max-w-xs"></td>
            <td class="py-3"><button onclick="deleteSetting('${s.key}')" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button></td></tr>`;
        });
      } catch (err) { console.error(err); }
    }

    async function addSetting() {
      const key = document.getElementById('newSettingKey').value;
      const value = document.getElementById('newSettingValue').value;
      if (!key) return;
      try { await fetch(`${API_URL}/api/settings`, { method: 'POST', headers, body: JSON.stringify({ key, value }) }); document.getElementById('newSettingKey').value=''; document.getElementById('newSettingValue').value=''; loadSettings(); } catch (err) { alert('Erro'); }
    }

    async function updateSetting(key, value) {
      try { await fetch(`${API_URL}/api/settings`, { method: 'POST', headers, body: JSON.stringify({ key, value }) }); } catch (err) { alert('Erro'); }
    }

    async function deleteSetting(key) {
      if (!confirm('Excluir configuração?')) return;
      try { await fetch(`${API_URL}/api/settings/${key}`, { method: 'DELETE', headers }); loadSettings(); } catch (err) { alert('Erro'); }
    }

    // === ADMINS ===
    async function loadAdmins() {
      try {
        const res = await fetch(`${API_URL}/api/admins`, { headers });
        const data = await res.json();
        const tbody = document.getElementById('tableAdmins');
        tbody.innerHTML = '';
        if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">Nenhum admin</td></tr>'; return; }
        data.forEach(a => {
          tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="py-3">${a.username}</td><td class="py-3">${a.email||'-'}</td>
            <td class="py-3"><button onclick="deleteAdmin(${a.id})" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button></td></tr>`;
        });
      } catch (err) { console.error(err); }
    }

    function openModalAdmin() { document.getElementById('modalAdmin').classList.remove('hidden'); }
    function closeModalAdmin() { document.getElementById('modalAdmin').classList.add('hidden'); }

    async function createAdmin() {
      try {
        const body = { username: document.getElementById('adminUsername').value, password: document.getElementById('adminPassword').value, email: document.getElementById('adminEmail').value };
        const res = await fetch(`${API_URL}/api/admins`, { method: 'POST', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro');
        closeModalAdmin(); loadAdmins();
      } catch (err) { alert(err.message); }
    }

    async function deleteAdmin(id) { if (!confirm('Excluir admin?')) return; try { await fetch(`${API_URL}/api/admins/${id}`, { method: 'DELETE', headers }); loadAdmins(); } catch (err) { alert('Erro'); } }

    function carregarPerfil() { const user = JSON.parse(localStorage.getItem('user') || '{}'); document.getElementById('profileUsername').value = user.username || ''; document.getElementById('profileEmail').value = user.email || ''; }
    function openModalPerfil() { carregarPerfil(); document.getElementById('modalPerfil').classList.remove('hidden'); }
    function closeModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
    async function salvarPerfil() { try { const body = {}; const e = document.getElementById('profileEmail').value; const p = document.getElementById('profilePassword').value; if(e) body.email=e; if(p) body.password=p; const res = await fetch(`${API_URL}/api/update-profile`,{method:'PUT',headers,body:JSON.stringify(body)}); if(!res.ok) throw new Error('Erro'); alert('Perfil atualizado!'); closeModalPerfil(); } catch(err){ alert(err.message); } }
    function sair() { fetch(`${API_URL}/api/logout`,{method:'POST',headers}).catch(()=>{}); localStorage.removeItem('token'); localStorage.removeItem('ms_token'); localStorage.removeItem('user'); window.location.href='login.html'; }
    function initMenuMobile() { const btn=document.getElementById('btnMenuMobile'); const sb=document.getElementById('sidebar'); if(btn) btn.addEventListener('click',()=>sb.classList.toggle('open')); }

    loadPlans(); loadSettings(); loadAdmins();
  </script>
</body>
</html>
