<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspots - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .sidebar{width:250px;} @media(max-width:768px){.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;z-index:50;top:0;left:0;height:100vh;}}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar bg-gray-800 flex flex-col p-4 min-h-screen">
    <div class="flex items-center gap-2 mb-8"><i data-lucide="wifi" class="w-7 h-7 text-cyan-400"></i><span class="text-lg font-bold">MS TELECOM</span></div>
    <nav class="flex flex-col gap-1 flex-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Dashboard</a>
      <a href="hotspots.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-400"><i data-lucide="router" class="w-5 h-5"></i>Hotspots</a>
      <a href="pops.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="radio-tower" class="w-5 h-5"></i>POPs</a>
      <a href="cadastro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="users" class="w-5 h-5"></i>Clientes</a>
      <a href="financeiro.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="banknote" class="w-5 h-5"></i>Financeiro</a>
      <a href="vouchers.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="ticket" class="w-5 h-5"></i>Vouchers</a>
      <a href="campanhas.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="megaphone" class="w-5 h-5"></i>Campanhas</a>
      <a href="webhooks.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="webhook" class="w-5 h-5"></i>Webhooks</a>
      <a href="configuracoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="settings" class="w-5 h-5"></i>Configurações</a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="file-text" class="w-5 h-5"></i>Logs</a>
      <a href="logs-auditoria.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 transition"><i data-lucide="shield" class="w-5 h-5"></i>Logs Auditoria</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <button id="btnMenuMobile" class="md:hidden p-2 hover:bg-gray-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <h1 class="text-2xl font-bold">Hotspots</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openModalCreate()" class="flex items-center gap-2 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i>Novo Hotspot</button>
        <button onclick="openModalPerfil()" class="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="user" class="w-4 h-4"></i>Perfil</button>
        <button onclick="sair()" class="flex items-center gap-2 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </header>

    <!-- Tabela de hotspots -->
    <div class="bg-gray-800 rounded-xl p-4">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 border-b border-gray-700"><th class="text-left py-3">Nome</th><th class="text-left py-3">Local</th><th class="text-left py-3">POP</th><th class="text-left py-3">RADIUS</th><th class="text-left py-3">Status</th><th class="text-left py-3">Ações</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Criar Hotspot -->
  <div id="modalCreate" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-lg">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Novo Hotspot</h3><button onclick="closeModalCreate()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Nome</label><input id="inputName" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Localização</label><input id="inputLocation" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Endereço</label><input id="inputAddress" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">DNS Name</label><input id="inputDnsName" type="text" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div class="flex items-center gap-2"><input id="inputRadius" type="checkbox" class="rounded"><label class="text-sm text-gray-400">Habilitar RADIUS</label></div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="createHotspot()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Criar</button>
        <button onclick="closeModalCreate()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Script MikroTik -->
  <div id="modalScript" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-2xl">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Script MikroTik / RouterOS</h3><button onclick="closeModalScript()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <pre id="scriptContent" class="bg-gray-900 p-4 rounded-lg text-sm text-green-400 overflow-auto max-h-96 whitespace-pre-wrap"></pre>
      <button onclick="copyScript()" class="mt-4 w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Copiar Script</button>
    </div>
  </div>

  <!-- Modal Perfil -->
  <div id="modalPerfil" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold">Meu Perfil</h3><button onclick="closeModalPerfil()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-400 mb-1">Usuário</label><input id="profileUsername" type="text" disabled class="w-full px-3 py-2 bg-gray-700 rounded-lg text-gray-300"></div>
        <div><label class="block text-sm text-gray-400 mb-1">E-mail</label><input id="profileEmail" type="email" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
        <div><label class="block text-sm text-gray-400 mb-1">Nova Senha</label><input id="profilePassword" type="password" placeholder="Deixe vazio para manter" class="w-full px-3 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-cyan-400"></div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="salvarPerfil()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium">Salvar</button>
        <button onclick="closeModalPerfil()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded-lg font-medium">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
    const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    lucide.createIcons();
    initMenuMobile();

    async function loadHotspots() {
      try {
        const res = await fetch(`${API_URL}/api/hotspots`, { headers });
        const data = await res.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-500">Nenhum hotspot cadastrado</td></tr>';
          return;
        }
        data.forEach(h => {
          const statusColor = h.status === 'active' ? 'text-green-400' : 'text-gray-400';
          tbody.innerHTML += `<tr class="border-b border-gray-700">
            <td class="py-3">${h.name}</td>
            <td class="py-3">${h.location || '-'}</td>
            <td class="py-3">${h.pop_id || '-'}</td>
            <td class="py-3">${h.radius_enabled ? '<span class="text-green-400">Sim</span>' : '<span class="text-gray-500">Não</span>'}</td>
            <td class="py-3 ${statusColor}">${h.status}</td>
            <td class="py-3 flex gap-2">
              <button onclick="showScript('${h.name}','${h.dns_name || ''}')" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">Script</button>
              <button onclick="deleteHotspot(${h.id})" class="px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs">Excluir</button>
            </td>
          </tr>`;
        });
      } catch (err) { console.error('Erro:', err); }
    }

    function openModalCreate() { document.getElementById('modalCreate').classList.remove('hidden'); }
    function closeModalCreate() { document.getElementById('modalCreate').classList.add('hidden'); }
    function closeModalScript() { document.getElementById('modalScript').classList.add('hidden'); }

    async function createHotspot() {
      try {
        const body = {
          name: document.getElementById('inputName').value,
          location: document.getElementById('inputLocation').value,
          address: document.getElementById('inputAddress').value,
          dns_name: document.getElementById('inputDnsName').value,
          radius_enabled: document.getElementById('inputRadius').checked
        };
        const res = await fetch(`${API_URL}/api/hotspots`, { method: 'POST', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error('Erro ao criar hotspot');
        closeModalCreate();
        loadHotspots();
      } catch (err) { alert(err.message); }
    }

    async function deleteHotspot(id) {
      if (!confirm('Deseja realmente excluir este hotspot?')) return;
      try {
        await fetch(`${API_URL}/api/hotspots/${id}`, { method: 'DELETE', headers });
        loadHotspots();
      } catch (err) { alert('Erro ao excluir'); }
    }

    function showScript(name, dnsName) {
      const apiUrl = API_URL;
      const script = `/ip hotspot profile
add name="${name}" login-by=http-chap,http-pap,mac-cookie html-directory=hotspot dns-name="${dnsName || name.toLowerCase() + '.hotspot'}"
rate-limit=0/0

/ip hotspot
add name="${name}" interface=bridge profile="${name}" address-pool=hs-pool-1 disabled=no

/ip hotspot walled-garden ip
add dst-host=${apiUrl.replace('https://','')} action=accept

# Script de heartbeat (agendar a cada 1 minuto)
/system scheduler
add name="hotspot-heartbeat" interval=00:01:00 on-event="/tool fetch url=\\"${apiUrl}/api/pops/${name.toLowerCase().replace(/\\s/g,'-')}/ping\\" http-method=post http-data=\\"{\\\\\\"name\\\\\\":\\\\\\"${name}\\\\\\",\\\\\\"ip\\\\\\":\\\\\\"0.0.0.0\\\\\\"}\\" http-header-field=\\"Content-Type: application/json\\" keep-result=no" policy=read,write,test`;
      document.getElementById('scriptContent').textContent = script;
      document.getElementById('modalScript').classList.remove('hidden');
    }

    function copyScript() {
      const text = document.getElementById('scriptContent').textContent;
      navigator.clipboard.writeText(text).then(() => alert('Script copiado!')).catch(() => alert('Erro ao copiar'));
    }

    // Funções padrão admin
    function carregarPerfil() { const user = JSON.parse(localStorage.getItem('user') || '{}'); document.getElementById('profileUsername').value = user.username || ''; document.getElementById('profileEmail').value = user.email || ''; }
    function openModalPerfil() { carregarPerfil(); document.getElementById('modalPerfil').classList.remove('hidden'); }
    function closeModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
    async function salvarPerfil() { try { const body = {}; const e = document.getElementById('profileEmail').value; const p = document.getElementById('profilePassword').value; if(e) body.email=e; if(p) body.password=p; const res = await fetch(`${API_URL}/api/update-profile`,{method:'PUT',headers,body:JSON.stringify(body)}); if(!res.ok) throw new Error('Erro'); alert('Perfil atualizado!'); closeModalPerfil(); } catch(err){ alert(err.message); } }
    function sair() { fetch(`${API_URL}/api/logout`,{method:'POST',headers}).catch(()=>{}); localStorage.removeItem('token'); localStorage.removeItem('ms_token'); localStorage.removeItem('user'); window.location.href='login.html'; }
    function initMenuMobile() { const btn=document.getElementById('btnMenuMobile'); const sb=document.getElementById('sidebar'); if(btn) btn.addEventListener('click',()=>sb.classList.toggle('open')); }

    loadHotspots();
  </script>
</body>
</html>
