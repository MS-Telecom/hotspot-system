<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MS Telecom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: linear-gradient(135deg, #0a0c15 0%, #1a1d2e 100%); }
        .glass-effect { background: rgba(15, 17, 25, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(59,130,246,0.2); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">MS Telecom</h1>
            <p class="text-gray-400">Crie sua conta de administrador</p>
        </div>

        <div class="glass-effect rounded-3xl border border-gray-700 p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="user-plus" class="w-5 h-5 text-blue-500"></i>
                Criar Conta Administrativa
            </h2>

            <form id="cadastroForm" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Nome de Usuário</label>
                    <input type="text" id="username" placeholder="Seu nome de usuário" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition" required>
                    <p id="erroUsername" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition" required>
                    <p id="erroEmail" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Senha</label>
                    <div class="relative">
                        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" 
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition pr-10" required>
                        <button type="button" onclick="toggleSenha()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-300">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <p id="erroSenha" class="text-xs text-red-500 mt-1 hidden"></p>
                    <div id="forcaSenha" class="mt-2 h-1 bg-gray-700 rounded-full overflow-hidden hidden">
                        <div id="forcaSenhaBar" class="h-full bg-red-500 transition-all" style="width: 0%"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Confirmar Senha</label>
                    <input type="password" id="confirmaSenha" placeholder="Confirme sua senha" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition" required>
                    <p id="erroConfirmaSenha" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div class="flex items-start gap-3">
                    <input type="checkbox" id="termos" class="mt-1 w-4 h-4 cursor-pointer" required>
                    <label for="termos" class="text-xs md:text-sm text-gray-400 cursor-pointer">
                        Concordo com os <a href="#" class="text-blue-500 hover:underline">Termos de Serviço</a> e 
                        <a href="#" class="text-blue-500 hover:underline">Política de Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 rounded-xl px-4 py-3 font-bold text-sm md:text-base transition mt-6">
                    Criar Conta de Administrador
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-gray-400 text-sm">Já tem uma conta? 
                    <a href="login.html" class="text-blue-500 hover:underline font-bold">Faça login</a>
                </p>
            </div>
        </div>

        <div class="mt-6 bg-blue-500/10 border border-blue-500/30 rounded-xl p-4">
            <p class="text-xs md:text-sm text-blue-400 flex items-start gap-2">
                <i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <span>Esta conta terá privilégios de administrador para gerenciar hotspots, clientes e configurações.</span>
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'https://mstelecom-api.duckdns.org';

        function toggleSenha() {
            const input = document.getElementById('senha');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('senha').addEventListener('input', function() {
            const senha = this.value;
            const forcaSenhaBar = document.getElementById('forcaSenhaBar');
            const forcaSenha = document.getElementById('forcaSenha');
            
            if (senha.length === 0) {
                forcaSenha.classList.add('hidden');
                return;
            }
            forcaSenha.classList.remove('hidden');
            
            let forca = 0;
            if (senha.length >= 8) forca += 25;
            if (senha.length >= 12) forca += 25;
            if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) forca += 25;
            if (/[0-9]/.test(senha)) forca += 15;
            if (/[!@#$%^&*]/.test(senha)) forca += 10;
            
            forcaSenhaBar.style.width = forca + '%';
            if (forca < 50) forcaSenhaBar.className = 'h-full bg-red-500 transition-all';
            else if (forca < 75) forcaSenhaBar.className = 'h-full bg-yellow-500 transition-all';
            else forcaSenhaBar.className = 'h-full bg-green-500 transition-all';
        });

        function validarEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            document.querySelectorAll('[id^="erro"]').forEach(el => el.classList.add('hidden'));

            let valido = true;

            if (!username) {
                document.getElementById('erroUsername').textContent = 'Nome de usuário é obrigatório';
                document.getElementById('erroUsername').classList.remove('hidden');
                valido = false;
            }

            if (!validarEmail(email)) {
                document.getElementById('erroEmail').textContent = 'Email inválido';
                document.getElementById('erroEmail').classList.remove('hidden');
                valido = false;
            }

            if (senha.length < 8) {
                document.getElementById('erroSenha').textContent = 'Senha deve ter no mínimo 8 caracteres';
                document.getElementById('erroSenha').classList.remove('hidden');
                valido = false;
            }

            if (senha !== confirmaSenha) {
                document.getElementById('erroConfirmaSenha').textContent = 'Senhas não conferem';
                document.getElementById('erroConfirmaSenha').classList.remove('hidden');
                valido = false;
            }

            if (!valido) return;

            // CORRIGIDO: endpoint /api/admins, payload com username, email, password, role
            const payload = {
                username: username,
                email: email,
                password: senha,
                role: "admin"
            };

            try {
                const res = await fetch(`${API_URL}/api/admins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                // Sucesso se retornar status 201 ou 200 e um objeto com 'id' ou 'success'
                if (res.ok && (data.id || data.success === true)) {
                    alert('Cadastro realizado com sucesso! Redirecionando para login...');
                    window.location.href = 'login.html';
                } else {
                    const msg = data.error || data.message || 'Tente novamente';
                    alert('Erro ao cadastrar: ' + msg);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao conectar com o servidor. Verifique sua conexão.');
            }
        });

        if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
