<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MS Telecom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: linear-gradient(135deg, #0a0c15 0%, #1a1d2e 100%); }
        .glass-effect { background: rgba(15, 17, 25, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">MS Telecom</h1>
            <p class="text-gray-400">Crie sua conta para gerenciar hotspots</p>
        </div>

        <div class="glass-effect rounded-3xl border border-gray-700 p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="user-plus" class="w-5 h-5 text-blue-500"></i>
                Criar Conta
            </h2>

            <form id="registrationForm" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Nome Completo</label>
                    <input type="text" id="name" placeholder="Seu nome completo" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                           required>
                    <p id="errorName" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                           required>
                    <p id="errorEmail" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Senha</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="Mínimo 8 caracteres" 
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition pr-10"
                               required>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-300">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <p id="errorPassword" class="text-xs text-red-500 mt-1 hidden"></p>
                    <div id="passwordStrength" class="mt-2 h-1 bg-gray-700 rounded-full overflow-hidden hidden">
                        <div id="passwordStrengthBar" class="h-full bg-red-500 transition-all" style="width: 0%"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" placeholder="Confirme sua senha" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                           required>
                    <p id="errorConfirmPassword" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-400 uppercase mb-2">Tipo de Conta</label>
                    <select id="accountType" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                            required>
                        <option value="">Selecione um tipo</option>
                        <option value="pessoal">Pessoal (até 5 hotspots)</option>
                        <option value="profissional">Profissional (até 20 hotspots)</option>
                        <option value="empresa">Empresa (ilimitado)</option>
                    </select>
                    <p id="errorAccountType" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div class="flex items-start gap-3">
                    <input type="checkbox" id="terms" class="mt-1 w-4 h-4 cursor-pointer" required>
                    <label for="terms" class="text-xs md:text-sm text-gray-400 cursor-pointer">
                        Concordo com os <a href="#" class="text-blue-500 hover:underline">Termos de Serviço</a> e 
                        <a href="#" class="text-blue-500 hover:underline">Política de Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 rounded-xl px-4 py-3 font-bold text-sm md:text-base transition mt-6">
                    Criar Conta
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-gray-400 text-sm">Já tem uma conta? 
                    <a href="login.html" class="text-blue-500 hover:underline font-bold">Faça login</a>
                </p>
            </div>
        </div>

        <div class="mt-6 bg-blue-500/10 border border-blue-500/30 rounded-xl p-4">
            <p class="text-xs md:text-sm text-blue-400 flex items-start gap-2">
                <i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <span>Após cadastrar, você poderá criar e gerenciar seus hotspots WiFi.</span>
            </p>
        </div>
    </div>

    <script>
        /**
         * CONFIGURAÇÃO DA API
         * CORRIGIDO: Endpoint centralizado e seguindo padrão RESTful
         */
        const API_BASE_URL = 'https://mstelecom-api.duckdns.org/api';

        const API = {
            async register(userData) {
                // CORRIGIDO: endpoint /api/cadastro -> /api/users (POST para criação)
                const response = await fetch(`${API_BASE_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                return await response.json();
            }
        };

        // Mostrar/esconder senha
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Validar força da senha
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const bar = document.getElementById('passwordStrengthBar');
            const container = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[!@#$%^&*]/.test(password)) strength += 10;
            
            bar.style.width = strength + '%';
            
            if (strength < 50) {
                bar.className = 'h-full bg-red-500 transition-all';
            } else if (strength < 75) {
                bar.className = 'h-full bg-yellow-500 transition-all';
            } else {
                bar.className = 'h-full bg-green-500 transition-all';
            }
        });

        // Validadores auxiliares
        const validators = {
            email: (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),
            password: (password) => password.length >= 8
        };

        // Enviar formulário
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Captura de elementos
            const fields = {
                name: document.getElementById('name'),
                email: document.getElementById('email'),
                password: document.getElementById('password'),
                confirmPassword: document.getElementById('confirmPassword'),
                accountType: document.getElementById('accountType')
            };

            // Limpar erros
            document.querySelectorAll('[id^="error"]').forEach(el => el.classList.add('hidden'));

            let isValid = true;

            // Validações de Frontend
            if (!fields.name.value.trim()) {
                document.getElementById('errorName').textContent = 'Nome é obrigatório';
                document.getElementById('errorName').classList.remove('hidden');
                isValid = false;
            }

            if (!validators.email(fields.email.value.trim())) {
                document.getElementById('errorEmail').textContent = 'Email inválido';
                document.getElementById('errorEmail').classList.remove('hidden');
                isValid = false;
            }

            if (!validators.password(fields.password.value)) {
                document.getElementById('errorPassword').textContent = 'Senha deve ter no mínimo 8 caracteres';
                document.getElementById('errorPassword').classList.remove('hidden');
                isValid = false;
            }

            if (fields.password.value !== fields.confirmPassword.value) {
                document.getElementById('errorConfirmPassword').textContent = 'Senhas não conferem';
                document.getElementById('errorConfirmPassword').classList.remove('hidden');
                isValid = false;
            }

            if (!fields.accountType.value) {
                document.getElementById('errorAccountType').textContent = 'Selecione um tipo de conta';
                document.getElementById('errorAccountType').classList.remove('hidden');
                isValid = false;
            }

            if (!isValid) return;

            // Preparação do Payload conforme novo Backend
            // CORRIGIDO: Mapeamento de campos para Inglês (name, email, password, account_type)
            const payload = {
                name: fields.name.value.trim(),
                email: fields.email.value.trim(),
                password: fields.password.value,
                account_type: fields.accountType.value
            };

            try {
                const data = await API.register(payload);

                // CORRIGIDO: Verificação flexível de resposta (success ou existência de ID)
                if (data.success || data.id) {
                    alert('Cadastro realizado com sucesso! Redirecionando para login...');
                    window.location.href = 'login.html';
                } else {
                    alert('Erro ao cadastrar: ' + (data.error || data.message || 'Tente novamente'));
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Erro ao conectar com o servidor. Verifique sua conexão.');
            }
        });

        // Inicializar ícones
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
