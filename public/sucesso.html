<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - MS TELECOM</title>
    <link rel="stylesheet" href="/assets/portal.css">
    <style>
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0a0c15 0%,#020617 100%);}
        .max-w-md{max-width:28rem}.w-20{width:5rem}.h-20{height:5rem}.mx-auto{margin-left:auto;margin-right:auto}.bg-white\/10{background:rgba(255,255,255,.10)}
        .bg-green-500\/20{background:rgba(34,197,94,.20)}.bg-gray-800\/50{background:rgba(31,41,55,.50)}.text-green-400{color:#4ade80}.text-left{text-align:left}
        .bg-cyan-500{background:#06b6d4}.hover\:bg-cyan-600:hover{background:#0891b2}.backdrop-blur{backdrop-filter:blur(12px)}.font-semibold{font-weight:600}
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full px-4 text-center">
        <div class="bg-white/10 backdrop-blur rounded-2xl p-8">
            <div class="w-20 h-20 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-6"><svg class="w-12 h-12 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></div>
            <h1 class="text-2xl font-bold">Pagamento Confirmado!</h1>
            <p class="text-gray-300 mt-2">Seu acesso foi liberado com sucesso.</p>
            <div class="bg-gray-800/50 rounded-lg p-4 mt-6 text-left space-y-2">
                <div class="flex justify-between"><span class="text-gray-400">Plano:</span><span id="planName">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Duração:</span><span id="planDuration">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Velocidade:</span><span id="planSpeed">-</span></div>
            </div>
            <a href="status.html" class="mt-6 inline-block bg-cyan-500 hover:bg-cyan-600 px-6 py-3 rounded-lg font-semibold transition">Ver Status da Conexão</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('plan')) document.getElementById('planName').innerText = params.get('plan');
        if(params.get('duration')) document.getElementById('planDuration').innerText = params.get('duration');
        if(params.get('speed')) document.getElementById('planSpeed').innerText = params.get('speed');
        setTimeout(() => { const link = params.get('link-orig'); if(link) window.location.href = link; }, 5000);
    </script>
</body>
</html>
