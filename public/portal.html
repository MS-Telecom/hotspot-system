<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Wi-Fi - MS TELECOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:'Inter',sans-serif;} .gradient-bg{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);}</style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <div class="max-w-md mx-auto px-4 py-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <i data-lucide="wifi" class="w-16 h-16 text-cyan-400 mx-auto mb-3"></i>
      <h1 class="text-3xl font-bold">MS TELECOM</h1>
      <p class="text-gray-300 mt-2">Conecte-se à internet</p>
    </div>

    <!-- Tabs -->
    <div class="flex bg-gray-800 rounded-lg p-1 mb-6">
      <button onclick="showTab('login')" id="tabLogin" class="flex-1 py-2 rounded-lg text-sm font-medium bg-cyan-500 text-white transition">Login</button>
      <button onclick="showTab('register')" id="tabRegister" class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition">Cadastro</button>
      <button onclick="showTab('voucher')" id="tabVoucher" class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition">Voucher</button>
    </div>

    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-lg mb-4 text-sm"></div>
    <div id="successMessage" class="hidden bg-green-500/20 border border-green-500 text-green-300 px-4 py-3 rounded-lg mb-4 text-sm"></div>

    <!-- Login Form -->
    <div id="formLogin" class="bg-white/10 backdrop-blur rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4">Acesse sua conta</h2>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-300 mb-1">CPF ou Telefone</label><input id="loginIdentifier" type="text" placeholder="000.000.000-00" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
        <div><label class="block text-sm text-gray-300 mb-1">Senha</label><input id="loginPassword" type="password" placeholder="Sua senha" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
      </div>
      <button onclick="portalLogin()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-3 rounded-lg font-semibold transition">Conectar</button>
    </div>

    <!-- Register Form -->
    <div id="formRegister" class="hidden bg-white/10 backdrop-blur rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4">Crie sua conta</h2>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-300 mb-1">Nome completo</label><input id="regName" type="text" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
        <div><label class="block text-sm text-gray-300 mb-1">CPF</label><input id="regCpf" type="text" placeholder="000.000.000-00" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
        <div><label class="block text-sm text-gray-300 mb-1">Telefone</label><input id="regPhone" type="text" placeholder="(00) 00000-0000" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
        <div><label class="block text-sm text-gray-300 mb-1">Senha</label><input id="regPassword" type="password" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400"></div>
      </div>
      <button onclick="portalRegister()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-3 rounded-lg font-semibold transition">Cadastrar</button>
    </div>

    <!-- Voucher Form -->
    <div id="formVoucher" class="hidden bg-white/10 backdrop-blur rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4">Usar Voucher</h2>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-300 mb-1">Código do Voucher</label><input id="voucherCode" type="text" placeholder="XXXX-XXXX-XXXX" class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white placeholder-gray-400 font-mono text-center text-lg tracking-wider"></div>
      </div>
      <button onclick="redeemVoucher()" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 py-3 rounded-lg font-semibold transition">Ativar Voucher</button>
    </div>

    <!-- Planos -->
    <div id="plansSection" class="hidden mt-6">
      <h2 class="text-lg font-semibold mb-4 text-center">Escolha seu plano</h2>
      <div id="plansList" class="space-y-3"></div>
    </div>

    <!-- PIX Payment -->
    <div id="pixSection" class="hidden mt-6 bg-white/10 backdrop-blur rounded-xl p-6 text-center">
      <h2 class="text-lg font-semibold mb-4">Pagamento PIX</h2>
      <img id="pixQrImg" src="" alt="QR Code PIX" class="mx-auto w-48 h-48 bg-white rounded-lg p-2 mb-4">
      <div class="bg-gray-800 rounded-lg p-3 mb-4"><p class="text-xs text-gray-400 mb-1">Copia e Cola:</p><p id="pixCode" class="text-sm break-all text-cyan-400 font-mono"></p></div>
      <button onclick="copyPix()" class="w-full bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg font-medium mb-2">Copiar Código PIX</button>
      <p class="text-xs text-gray-400 mt-2">Aguardando confirmação do pagamento...</p>
      <div id="pixSpinner" class="mt-3"><i data-lucide="loader-2" class="w-6 h-6 text-cyan-400 animate-spin mx-auto"></i></div>
    </div>
  </div>

  <footer class="text-center py-4 text-gray-500 text-sm">&copy; 2026 MS TELECOM</footer>

  <script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    const urlParams = new URLSearchParams(window.location.search);
    const mac = urlParams.get('mac') || '';
    const ip = urlParams.get('ip') || '';
    const link_orig = urlParams.get('link-orig') || '';

    lucide.createIcons();

    function showTab(tab) {
      document.getElementById('formLogin').classList.add('hidden');
      document.getElementById('formRegister').classList.add('hidden');
      document.getElementById('formVoucher').classList.add('hidden');
      document.getElementById('tabLogin').className = 'flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition';
      document.getElementById('tabRegister').className = 'flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition';
      document.getElementById('tabVoucher').className = 'flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition';

      document.getElementById(`form${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.remove('hidden');
      document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-cyan-500 text-white transition';
      hideMessages();
    }

    function showError(msg) { const el = document.getElementById('errorMessage'); el.textContent = msg; el.classList.remove('hidden'); document.getElementById('successMessage').classList.add('hidden'); }
    function showSuccess(msg) { const el = document.getElementById('successMessage'); el.textContent = msg; el.classList.remove('hidden'); document.getElementById('errorMessage').classList.add('hidden'); }
    function hideMessages() { document.getElementById('errorMessage').classList.add('hidden'); document.getElementById('successMessage').classList.add('hidden'); }

    async function portalLogin() {
      hideMessages();
      try {
        const res = await fetch(`${API_URL}/api/portal/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('loginIdentifier').value, password: document.getElementById('loginPassword').value, mac_address: mac })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro no login');

        if (data.status === 'active') {
          showSuccess('Conectado! Redirecionando...');
          setTimeout(() => { if (link_orig) window.location.href = link_orig; }, 2000);
        } else {
          showSuccess('Login realizado! Escolha um plano para se conectar.');
          localStorage.setItem('portal_user_id', data.user_id);
          loadPlans();
        }
      } catch (err) { showError(err.message); }
    }

    async function portalRegister() {
      hideMessages();
      try {
        const res = await fetch(`${API_URL}/api/portal/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('regName').value, cpf: document.getElementById('regCpf').value, phone: document.getElementById('regPhone').value, password: document.getElementById('regPassword').value, mac_address: mac })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro no cadastro');
        showSuccess('Cadastro realizado! Escolha um plano.');
        localStorage.setItem('portal_user_id', data.user_id);
        loadPlans();
      } catch (err) { showError(err.message); }
    }

    async function redeemVoucher() {
      hideMessages();
      try {
        const code = document.getElementById('voucherCode').value.trim();
        const res = await fetch(`${API_URL}/api/portal/voucher`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, mac_address: mac })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Voucher inválido');
        showSuccess('Voucher ativado! Conectando...');
        setTimeout(() => { if (link_orig) window.location.href = link_orig; }, 2000);
      } catch (err) { showError(err.message); }
    }

    async function loadPlans() {
      try {
        const res = await fetch(`${API_URL}/api/portal/plans`);
        const plans = await res.json();
        const container = document.getElementById('plansList');
        container.innerHTML = '';
        (plans || []).forEach(p => {
          container.innerHTML += `<div class="bg-white/10 backdrop-blur rounded-xl p-4 flex items-center justify-between cursor-pointer hover:bg-white/20 transition" onclick="selectPlan(${p.id},'${p.name}',${p.price})">
            <div><h3 class="font-semibold">${p.name}</h3><p class="text-sm text-gray-400">${p.duration_days || '-'} dias - ${p.speed_mbps ? p.speed_mbps + ' Mbps' : '-'}</p></div>
            <div class="text-right"><p class="text-xl font-bold text-cyan-400">R$ ${parseFloat(p.price).toFixed(2).replace('.',',')}</p></div>
          </div>`;
        });
        document.getElementById('plansSection').classList.remove('hidden');
      } catch (err) { console.error(err); }
    }

    async function selectPlan(planId, planName, price) {
      hideMessages();
      const userId = localStorage.getItem('portal_user_id');
      try {
        const res = await fetch(`${API_URL}/api/portal/create-pix`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, plan_id: planId, plan_name: planName, amount: price, mac_address: mac })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao gerar PIX');

        document.getElementById('plansSection').classList.add('hidden');
        document.getElementById('pixQrImg').src = data.qr_code_base64 ? `data:image/png;base64,${data.qr_code_base64}` : '';
        document.getElementById('pixCode').textContent = data.pix_copy_paste || '';
        document.getElementById('pixSection').classList.remove('hidden');
        lucide.createIcons();

        // Poll para verificar pagamento
        if (data.payment_id) pollPayment(data.payment_id);
      } catch (err) { showError(err.message); }
    }

    async function pollPayment(paymentId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_URL}/api/portal/check-payment/${paymentId}`);
          const data = await res.json();
          if (data.status === 'approved') {
            clearInterval(interval);
            showSuccess('Pagamento confirmado! Conectando...');
            document.getElementById('pixSection').classList.add('hidden');
            setTimeout(() => { if (link_orig) window.location.href = link_orig; }, 2000);
          }
        } catch (err) { console.error(err); }
      }, 5000);
    }

    function copyPix() {
      const text = document.getElementById('pixCode').textContent;
      navigator.clipboard.writeText(text).then(() => alert('Código PIX copiado!')).catch(() => {});
    }
  </script>
</body>
</html>
