<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MS Telecom | Hotspots / POPs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0c15; }
        .glass-card { background: rgba(15, 25, 35, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(59,130,246,0.2); transition: all 0.2s ease; }
        .glass-card:hover { border-color: rgba(59,130,246,0.5); }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.2), transparent); border-left: 3px solid #3b82f6; color: #3b82f6; }
        .sidebar-link:hover { background: rgba(59,130,246,0.1); color: #60a5fa; }
        #sidebar { z-index: 100; }
        #menuToggle { z-index: 101; }
        #menuOverlay { z-index: 99; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0a0c15] text-gray-200">

<script>
    const token = localStorage.getItem('token') || localStorage.getItem('ms_token');
    if (!token) window.location.href = 'login.html';
</script>

<button id="menuToggle" class="md:hidden fixed top-4 left-4 z-[101] p-2 bg-blue-600 rounded-lg text-white shadow-lg">
    <i data-lucide="menu" class="w-5 h-5"></i>
</button>
<div id="menuOverlay" class="hidden md:hidden fixed inset-0 bg-black/50 z-[90]"></div>

<div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 bg-[#0f1119] hidden md:flex md:flex-col fixed md:static inset-y-0 left-0 z-[80] transition-all border-r border-gray-800 flex flex-col shrink-0">
        <div class="p-6 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg">
                    <i data-lucide="zap" class="text-white w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight">MS <span class="text-blue-500">TELECOM</span></h1>
                    <p class="text-[9px] text-gray-500 uppercase tracking-wider">NOC Commander</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-wider px-4 mb-2">Operações</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="hotspots.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="router" class="w-5 h-5"></i> Hotspots / POPs
            </a>
            <a href="cliente-detalhe.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="users" class="w-5 h-5"></i> Clientes / SGP
            </a>
            <a href="financeiro.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="banknote" class="w-5 h-5"></i> Financeiro
            </a>
            <a href="vouchers.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="ticket" class="w-5 h-5"></i> Vouchers
            </a>
            <a href="configuracoes.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="settings" class="w-5 h-5"></i> Configurações
            </a>
            <a href="perfil-cadastro.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">
                <i data-lucide="user-cog" class="w-5 h-5"></i> Perfil de Cadastro
            </a>
        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto bg-[#0a0c15] w-full md:w-auto">
        <header class="sticky top-0 z-10 bg-[#0a0c15]/95 backdrop-blur-sm border-b border-gray-800 px-4 md:px-8 py-4 flex justify-between items-center gap-4 flex-wrap">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4"></i>
                <input type="text" id="searchInput" placeholder="Buscar hotspot..." class="w-full bg-gray-900/50 border border-gray-700 rounded-xl pl-11 pr-4 py-2.5 text-sm outline-none focus:border-blue-500 transition">
            </div>
            <div class="flex items-center gap-3 md:gap-4">
                <div class="text-right hidden sm:block"><p class="text-xs font-bold text-white">Bem-vindo, <span id="userName">Administrador</span></p><p class="text-[9px] text-emerald-500 font-bold uppercase">Sistema Operacional</p></div>
                <button onclick="openModalPerfil()" class="p-2 hover:bg-gray-800 rounded-lg transition" title="Meu Perfil"><i data-lucide="user-circle" class="w-5 h-5 text-blue-400"></i></button>
                <button onclick="sair()" class="p-2 hover:bg-red-500/20 rounded-lg transition" title="Sair"><i data-lucide="log-out" class="w-5 h-5 text-red-400"></i></button>
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center shadow-lg"><span class="text-white font-bold text-xs md:text-sm">AD</span></div>
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-6 md:space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                <div><h1 class="text-2xl md:text-3xl font-black tracking-tight">Hotspots / POPs</h1><p class="text-gray-500 text-xs md:text-sm mt-1">Gerencie seus Pontos de Presença e hotspots Wi-Fi</p></div>
                <button onclick="openNewPopModal()" class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white px-4 md:px-6 py-2 md:py-3 rounded-xl font-bold text-sm shadow-lg hover:shadow-blue-500/20 transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Novo Hotspot</button>
            </div>
            <div id="popsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"><div class="text-center text-gray-500 py-8 col-span-3">Carregando POPs...</div></div>
        </div>
    </main>
</div>

<!-- MODAL: NOVO HOTSPOT -->
<div id="modalNewPop" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] hidden p-2">
    <div class="bg-[#0f1119] rounded-3xl w-full max-w-sm md:max-w-md max-h-[90vh] flex flex-col border border-gray-700 shadow-2xl">
        <div class="flex justify-between items-center p-3 md:p-4 border-b border-gray-800 shrink-0"><h2 class="text-sm md:text-base font-bold text-white flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4 text-blue-500"></i><span id="modalPopTitle">Configurar Novo Hotspot</span></h2><button onclick="closeNewPopModal()" class="p-1.5 hover:bg-gray-800 rounded-lg"><i data-lucide="x" class="w-4 h-4 text-gray-400"></i></button></div>
        <div class="flex-1 overflow-y-auto p-3 md:p-4 space-y-3 custom-scrollbar">
            <input type="hidden" id="editPopId" value="">
            <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome do Hotspot *</label><input type="text" id="popName" placeholder="MS-WIFI-POP-01" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Localização</label><input type="text" id="popLocation" placeholder="Bairro, Cidade" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">IP do POP</label><input type="text" id="popIp" placeholder="192.168.1.1" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm"></div>
        </div>
        <div class="p-3 md:p-4 border-t border-gray-800 flex justify-end gap-2 shrink-0"><button onclick="closeNewPopModal()" class="px-3 py-1.5 bg-gray-800 rounded-lg text-xs">Cancelar</button><button onclick="saveNewPop()" class="px-3 py-1.5 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-lg text-xs font-bold text-white">Criar Hotspot</button></div>
    </div>
</div>

<script>
    const API_URL = 'https://mstelecom-api.duckdns.org';
    
    function authHeaders() {
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    async function loadPops() {
        try {
            const res = await fetch(`${API_URL}/api/pops`, { headers: authHeaders() });
            if (!res.ok) throw new Error();
            const pops = await res.json();
            const container = document.getElementById('popsGrid');
            if (!pops || pops.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8 col-span-3">Nenhum POP cadastrado.</div>';
                return;
            }
            container.innerHTML = pops.map(pop => `
                <div class="glass-card rounded-2xl p-5 border border-gray-800">
                    <div class="flex justify-between items-start mb-3">
                        <div><h3 class="text-base font-bold text-white">${pop.name}</h3><p class="text-[10px] text-gray-500">IP: ${pop.ip || 'N/A'}</p></div>
                        <span class="px-2 py-1 bg-green-500/20 text-green-400 text-[10px] font-bold rounded-full">ONLINE</span>
                    </div>
                    <p class="text-xs text-gray-400">📍 ${pop.location || 'Localização não definida'}</p>
                    <div class="mt-3 pt-3 border-t border-gray-700 flex justify-end gap-2">
                        <button onclick="deletePop(${pop.id})" class="p-2 hover:bg-red-500/10 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4 text-red-500"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        } catch (error) {
            document.getElementById('popsGrid').innerHTML = '<div class="text-center text-red-500 py-8 col-span-3">Erro ao carregar POPs.</div>';
        }
    }

    async function saveNewPop() {
        const name = document.getElementById('popName').value;
        const location = document.getElementById('popLocation').value;
        const ip = document.getElementById('popIp').value;
        if (!name) return alert('Nome é obrigatório');
        try {
            const res = await fetch(`${API_URL}/api/pops`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ name, location, ip })
            });
            if (res.ok) { closeNewPopModal(); loadPops(); } else alert('Erro ao salvar');
        } catch (error) { alert('Erro na conexão'); }
    }

    async function deletePop(id) {
        if (!confirm('Deseja excluir este POP?')) return;
        try {
            const res = await fetch(`${API_URL}/api/pops/${id}`, { method: 'DELETE', headers: authHeaders() });
            if (res.ok) loadPops(); else alert('Erro ao excluir');
        } catch (error) { alert('Erro na conexão'); }
    }

    function openNewPopModal() { document.getElementById('modalNewPop').classList.remove('hidden'); }
    function closeNewPopModal() { document.getElementById('modalNewPop').classList.add('hidden'); }
    function sair() { localStorage.removeItem('token'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        loadPops();
        lucide.createIcons();
    });
</script>
</body>
</html>
