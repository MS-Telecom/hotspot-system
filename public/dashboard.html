<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - MS TELECOM</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: 'Inter', sans-serif; background:#0a0c15; }
.card { background: rgba(15,25,35,0.6); backdrop-filter: blur(10px); border:1px solid rgba(59,130,246,0.2); }
.card:hover { border-color: rgba(59,130,246,0.5); }
</style>
</head>

<body class="text-gray-200">

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';

const API_URL = 'https://mstelecom-api.duckdns.org';
const headers = { Authorization: `Bearer ${token}` };
</script>

<div class="p-6 space-y-6">

<h1 class="text-3xl font-bold">Dashboard</h1>

<!-- CARDS -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Total Revenue</p>
<h2 id="totalRevenueCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Monthly Revenue</p>
<h2 id="monthRevenueCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Active Users</p>
<h2 id="activeUsersCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Pending Payments</p>
<h2 id="pendingPaymentsCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Hotspots</p>
<h2 id="hotspotsCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">POPs</p>
<h2 id="popsCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Active Sessions</p>
<h2 id="sessionsCard" class="text-2xl font-bold">0</h2>
</div>

<div class="card p-4 rounded-xl">
<p class="text-sm text-gray-400">Vouchers</p>
<h2 id="vouchersCard" class="text-2xl font-bold">0</h2>
</div>

</div>

<!-- CHART -->
<div class="card p-6 rounded-xl">
<h3 class="mb-4 font-bold">Users (24h)</h3>
<canvas id="usersChart"></canvas>
</div>

</div>

<script>

async function loadDashboard() {
    const res = await fetch(`${API_URL}/api/stats`, { headers });
    const data = await res.json();

    document.getElementById('totalRevenueCard').innerText = data.totalRevenue || 0;
    document.getElementById('monthRevenueCard').innerText = data.monthRevenue || 0;
    document.getElementById('activeUsersCard').innerText = data.activeUsers || 0;
    document.getElementById('pendingPaymentsCard').innerText = data.pendingPayments || 0;
    document.getElementById('hotspotsCard').innerText = data.totalHotspots || 0;
    document.getElementById('popsCard').innerText = data.totalPops || 0;
    document.getElementById('sessionsCard').innerText = data.activeSessions || 0;
    document.getElementById('vouchersCard').innerText = data.totalVouchers || 0;

    renderChart();
}

function renderChart() {
    const ctx = document.getElementById('usersChart');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array.from({length: 24}, (_, i) => i),
            datasets: [{
                label: 'Users',
                data: Array.from({length: 24}, () => Math.floor(Math.random()*50))
            }]
        }
    });
}

loadDashboard();

lucide.createIcons();

</script>

</body>
</html>
