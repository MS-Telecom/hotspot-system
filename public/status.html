<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - MS TELECOM</title>
    <link rel="stylesheet" href="/assets/portal.css">
    <style>
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0a0c15 0%,#020617 100%);}
        .max-w-md{max-width:28rem}.w-16{width:4rem}.h-16{height:4rem}.w-20{width:5rem}.h-20{height:5rem}.mx-auto{margin-left:auto;margin-right:auto}
        .bg-white\/10{background:rgba(255,255,255,.10)}.bg-green-500\/20{background:rgba(34,197,94,.20)}.bg-gray-900\/30{background:rgba(17,24,39,.30)}
        .bg-red-600{background:#dc2626}.hover\:bg-red-700:hover{background:#b91c1c}.text-cyan-400{color:#22d3ee}.text-green-400{color:#4ade80}.text-left{text-align:left}
        .backdrop-blur{backdrop-filter:blur(12px)}.mt-2{margin-top:.5rem}.font-semibold{font-weight:600}
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full px-4">
        <div class="text-center mb-8"><svg class="w-16 h-16 text-cyan-400 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg><h1 class="text-2xl font-bold mt-2">MS TELECOM</h1></div>
        <div class="bg-white/10 backdrop-blur rounded-2xl p-6 text-center">
            <div id="statusIcon" class="w-20 h-20 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-4"><svg class="w-10 h-10 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></div>
            <h2 id="statusTitle" class="text-xl font-semibold">Conectado</h2>
            <p id="statusMessage" class="text-gray-300 mt-1">Você está conectado à internet</p>
            <div class="mt-6 space-y-2 text-left bg-gray-900/30 rounded-xl p-4">
                <div class="flex justify-between"><span class="text-gray-400">Plano:</span><span id="detailPlan">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Tempo restante:</span><span id="detailTime">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Velocidade:</span><span id="detailSpeed">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">IP:</span><span id="detailIp">-</span></div>
                <div class="flex justify-between"><span class="text-gray-400">MAC:</span><span id="detailMac">-</span></div>
            </div>
            <button onclick="disconnect()" class="mt-6 w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-semibold transition">Desconectar</button>
        </div>
    </div>
    <script>
        const API_URL = 'https://mstelecom-api.duckdns.org';
        const urlParams = new URLSearchParams(window.location.search);
        const mac = urlParams.get('mac') || '';
        const ip = urlParams.get('ip') || '';
        async function loadStatus() {
            try {
                const res = await fetch(`${API_URL}/api/portal/status?mac=${mac}&ip=${ip}`);
                const data = await res.json();
                document.getElementById('detailPlan').innerText = data.plan_name || '-';
                document.getElementById('detailTime').innerText = data.time_remaining || '-';
                document.getElementById('detailSpeed').innerText = data.speed || '-';
                document.getElementById('detailIp').innerText = ip || '-';
                document.getElementById('detailMac').innerText = mac || '-';
            } catch(err) { console.error(err); }
        }
        function disconnect() { if(confirm('Deseja desconectar?')) window.location.href = 'portal.html'; }
        loadStatus();
    </script>
</body>
</html>
