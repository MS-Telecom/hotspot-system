<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Hotspot - MS Telecom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .gradient-text { background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%); transition: all 0.3s ease; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-inactive { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-sky-500/10 border border-sky-500/20 mb-2">
        <i data-lucide="wifi" class="w-8 h-8 text-sky-400"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">MS <span class="gradient-text">Telecom</span></h1>
      <p class="text-slate-400">Conecte-se agora com alta velocidade</p>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="hidden glass-card rounded-2xl p-4 text-center text-sm animate-pulse-soft"></div>

    <!-- Main Content -->
    <div id="mainContent" class="space-y-6">
      <!-- Device Info -->
      <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-lg bg-slate-800">
            <i data-lucide="smartphone" class="w-5 h-5 text-slate-400"></i>
          </div>
          <div>
            <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Seu Dispositivo</p>
            <p id="macDisplay" class="font-mono text-sm text-slate-300">Detectando...</p>
          </div>
        </div>
        <div id="accessBadge" class="status-badge status-inactive">Sem Acesso</div>
      </div>

      <!-- Free Trial Button -->
      <button id="testeGratisBtn" class="hidden w-full py-4 rounded-2xl font-bold text-white bg-slate-800 border border-slate-700 hover:bg-slate-700 transition-all flex items-center justify-center gap-2">
        <i data-lucide="beaker" class="w-5 h-5"></i>
        Teste grátis 15min
      </button>

      <!-- Plans Section -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-sky-400"></i>
          Escolha seu Plano
        </h2>
        <div id="plansContainer" class="grid grid-cols-1 gap-3">
          <!-- Plans will be loaded here -->
          <div class="animate-pulse space-y-3">
            <div class="h-24 bg-slate-800 rounded-2xl"></div>
            <div class="h-24 bg-slate-800 rounded-2xl"></div>
          </div>
        </div>
      </div>

      <!-- Payment Section (Hidden by default) -->
      <div id="paymentSection" class="hidden glass-card rounded-2xl p-6 space-y-6 border-sky-500/30">
        <div class="text-center space-y-2">
          <h3 class="text-xl font-bold">Pagamento via PIX</h3>
          <p class="text-sm text-slate-400">Escaneie o QR Code ou copie o código abaixo</p>
        </div>
        
        <div class="flex justify-center">
          <div id="qrCodeContainer" class="p-4 bg-white rounded-2xl">
            <div id="qrCodeInner" class="w-48 h-48 flex items-center justify-center text-slate-900 font-bold">Gerando...</div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs text-slate-500 uppercase font-semibold">Código PIX</label>
          <div class="flex gap-2">
            <div id="pixCode" class="flex-1 p-3 bg-slate-900 rounded-xl text-xs font-mono break-all border border-slate-800 text-slate-300">Gerando PIX...</div>
            <button id="copyPixBtn" class="p-3 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors">
              <i data-lucide="copy" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <button id="jaPagueiBtn" class="w-full py-4 rounded-2xl font-bold text-white btn-primary">
            Já realizei o pagamento
          </button>
          <button id="cancelarPagamentoBtn" class="w-full py-3 text-sm text-slate-400 hover:text-white transition-colors">
            Cancelar e voltar
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center text-xs text-slate-500">
      &copy; 2026 MS Telecom - Todos os direitos reservados
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let macAddress = '';
    let selectedPlan = null;
    let redirectInProgress = false;

    // Elements
    const statusMessage = document.getElementById('statusMessage');
    const macDisplay = document.getElementById('macDisplay');
    const accessBadge = document.getElementById('accessBadge');
    const testeGratisBtn = document.getElementById('testeGratisBtn');
    const plansContainer = document.getElementById('plansContainer');
    const paymentSection = document.getElementById('paymentSection');
    const qrCodeInner = document.getElementById('qrCodeInner');
    const pixCode = document.getElementById('pixCode');
    const jaPagueiBtn = document.getElementById('jaPagueiBtn');

    // Initialize
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    macAddress = getQueryParam('mac') || getQueryParam('mac_address') || '';
    if (macAddress) {
      macDisplay.textContent = macAddress.toUpperCase();
      localStorage.setItem('hotspot_mac', macAddress);
    } else {
      macAddress = localStorage.getItem('hotspot_mac') || '';
      if (macAddress) macDisplay.textContent = macAddress.toUpperCase();
    }

    function showStatusMessage(msg, type = 'info') {
      statusMessage.textContent = msg;
      statusMessage.classList.remove('hidden', 'text-sky-400', 'text-green-400', 'text-red-400', 'text-amber-400');
      
      if (type === 'success') statusMessage.classList.add('text-green-400');
      else if (type === 'error') statusMessage.classList.add('text-red-400');
      else if (type === 'warning') statusMessage.classList.add('text-amber-400');
      else statusMessage.classList.add('text-sky-400');
      
      statusMessage.scrollIntoView({ behavior: 'smooth' });
    }

    function redirectToMikrotik(mac) {
      const link = getQueryParam('link-login-only') || 'http://10.254.1.1/login';
      const dst = getQueryParam('dst') || 'http://www.google.com';
      const username = encodeURIComponent(mac);
      const password = 'password';
      window.location.href = `${link}?username=${username}&password=${password}&dst=${encodeURIComponent(dst)}`;
    }

    async function loadPlans() {
      try {
        const res = await fetch(`${API_BASE}/api/plans`);
        const plans = await res.json();
        
        plansContainer.innerHTML = '';
        plans.forEach(plan => {
          const card = document.createElement('div');
          card.className = 'glass-card rounded-2xl p-5 hover:border-sky-500/50 transition-all cursor-pointer group';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="space-y-1">
                <h3 class="font-bold text-lg group-hover:text-sky-400 transition-colors">${plan.name}</h3>
                <p class="text-xs text-slate-400">${plan.description || plan.duration_days + ' dias de acesso'}</p>
              </div>
              <div class="text-right">
                <p class="text-xl font-bold text-sky-400">R$ ${plan.price.toFixed(2)}</p>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">Pagamento Único</p>
              </div>
            </div>
          `;
          
          card.onclick = () => generatePix(plan);
          plansContainer.appendChild(card);
        });
      } catch (error) {
        plansContainer.innerHTML = '<p class="text-center text-slate-500 py-4">Erro ao carregar planos.</p>';
      }
    }

    async function generatePix(plan) {
      if (!macAddress) {
        showStatusMessage('MAC não detectado. Conecte-se ao Wi-Fi novamente.', 'error');
        return;
      }

      selectedPlan = plan;
      paymentSection.classList.remove('hidden');
      paymentSection.scrollIntoView({ behavior: 'smooth' });
      qrCodeInner.innerHTML = '<div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900"></div>';
      pixCode.textContent = 'Gerando código PIX...';

      try {
        const res = await fetch(`${API_BASE}/api/payments/pix`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            plan_id: plan.id,
            mac_address: macAddress
          })
        });
        
        const data = await res.json();
        if (data.qr_code_base64) {
          qrCodeInner.innerHTML = `<img src="data:image/png;base64,${data.qr_code_base64}" class="w-full h-full">`;
          pixCode.textContent = data.copy_paste_code;
        } else {
          throw new Error('QR Code não gerado');
        }
      } catch (error) {
        showStatusMessage('Erro ao gerar PIX. Tente novamente.', 'error');
        paymentSection.classList.add('hidden');
      }
    }

    async function loadFreeTrialSettings() {
      try {
        const res = await fetch(`${API_BASE}/api/settings/free_trial`);
        if (!res.ok) throw new Error('Falha ao carregar config');
        const cfg = await res.json();
        window.__freeTrialCfg = cfg || {};
        const durationSeconds = Number(cfg.duration_seconds ?? (cfg.duration_minutes ? cfg.duration_minutes * 60 : 900));
        window.__freeTrialDurationLabel = (Number.isFinite(durationSeconds) && durationSeconds < 60)
          ? `${Math.max(10, Math.floor(durationSeconds))}s`
          : `${Math.max(1, Math.ceil(durationSeconds / 60))}min`;
      } catch (error) {
        window.__freeTrialCfg = { enabled: false };
      }
    }

    async function checkFreeTrialEligibility() {
      if (!macAddress || redirectInProgress) return;
      try {
        const res = await fetch(`${API_BASE}/api/access/status?mac=${encodeURIComponent(macAddress)}`);
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.allowed === true) {
          redirectInProgress = true;
          accessBadge.textContent = 'Ativo';
          accessBadge.className = 'status-badge status-active';
          showStatusMessage('Plano ativo encontrado. Liberando acesso...', 'info');
          testeGratisBtn.classList.add('hidden');
          setTimeout(() => redirectToMikrotik(macAddress), 1000);
          return;
        }

        if (data.show_free_trial === true) {
          testeGratisBtn.classList.remove('hidden');
          testeGratisBtn.innerHTML = `<i data-lucide="beaker" class="w-4 h-4"></i> Teste grátis ${window.__freeTrialDurationLabel || ''}`;
          lucide.createIcons();
        } else {
          testeGratisBtn.classList.add('hidden');
          if (data.reason === 'cooldown' && data.retry_after_seconds) {
            console.log(`Teste grátis em cooldown: ${data.retry_after_seconds}s restantes`);
          }
        }
      } catch (_e) {}
    }

    testeGratisBtn.addEventListener('click', async () => {
      if (!macAddress) {
        showStatusMessage('MAC não detectado.', 'error');
        return;
      }

      if (redirectInProgress) return;

      try {
        testeGratisBtn.disabled = true;
        testeGratisBtn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';
        
        const res = await fetch(`${API_BASE}/api/free-trial`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mac_address: macAddress })
        });
        
        const data = await res.json();
        if (res.ok) {
          redirectInProgress = true;
          showStatusMessage('Teste grátis liberado! Redirecionando...', 'success');
          setTimeout(() => redirectToMikrotik(macAddress), 1500);
        } else {
          throw new Error(data.error || 'Erro ao liberar teste');
        }
      } catch (error) {
        showStatusMessage(error.message, 'error');
        testeGratisBtn.disabled = false;
        testeGratisBtn.innerHTML = `<i data-lucide="beaker" class="w-5 h-5"></i> Teste grátis ${window.__freeTrialDurationLabel || ''}`;
        lucide.createIcons();
      }
    });

    jaPagueiBtn.addEventListener('click', async () => {
      if (!macAddress) return;
      try {
        jaPagueiBtn.disabled = true;
        const res = await fetch(`${API_BASE}/api/check-payment?mac=${encodeURIComponent(macAddress)}`);
        const data = await res.json();
        
        if (data && (data.status === 'approved' || data.status === 'paid')) {
          showStatusMessage('Pagamento confirmado! Redirecionando...', 'success');
          setTimeout(() => redirectToMikrotik(macAddress), 1500);
        } else {
          showStatusMessage('Pagamento ainda não detectado. Tente em alguns instantes.', 'warning');
          jaPagueiBtn.disabled = false;
        }
      } catch (error) {
        showStatusMessage('Erro ao verificar pagamento.', 'error');
        jaPagueiBtn.disabled = false;
      }
    });

    document.getElementById('cancelarPagamentoBtn').addEventListener('click', () => {
      paymentSection.classList.add('hidden');
      selectedPlan = null;
    });

    document.getElementById('copyPixBtn').addEventListener('click', () => {
      const code = pixCode.textContent;
      if (code && !code.includes('Gerando')) {
        navigator.clipboard.writeText(code);
        showStatusMessage('Código PIX copiado!', 'info');
      }
    });

    // Initial checks
    lucide.createIcons();
    loadPlans();
    loadFreeTrialSettings().then(() => {
      checkFreeTrialEligibility();
    });

    // Check status periodically
    setInterval(() => {
      if (!redirectInProgress) checkFreeTrialEligibility();
    }, 30000);
  </script>
</body>
</html>
