<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <script>
        (function() {
            var currentUrl = new URL(window.location.href);
            var targetUrl = new URL('/portal.html', window.location.origin);
            
            // Preservar todos os parâmetros da query string
            currentUrl.searchParams.forEach(function(value, key) {
                targetUrl.searchParams.set(key, value);
            });
            
            // Preservar o hash
            targetUrl.hash = currentUrl.hash;
            
            // Redirecionar
            window.location.replace(targetUrl.toString());
        })();
    </script>
</head>
<body>
    <p>Redirecionando para o portal... <a id="manual-link" href="/portal.html">clique aqui</a> se não for redirecionado.</p>
    <script>
        document.getElementById('manual-link').href = '/portal.html' + window.location.search + window.location.hash;
    </script>
</body>
</html>
